# Impronte delle illustrazioni di tutte le carte (riconoscimento per immagine nell'app).
# Calcola solo le carte nuove e pubblica il file sul ramo "impronte" (sempre un solo commit).
name: Impronte delle carte
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      prova:
        description: "Ricalcola tutto e misura la precisione su foto simulate"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: [tools/impronte.py, .github/workflows/impronte.yml]
permissions:
  contents: write
concurrency:
  group: impronte
  cancel-in-progress: false
jobs:
  impronte:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - name: Impronte già calcolate
        run: |
          git fetch --depth 1 origin impronte && git show origin/impronte:impronte.json > precedenti.json || echo "prima volta"
      - name: Pillow
        run: python3 -m pip install --quiet pillow
      - name: Calcola le impronte
        env:
          TEMPO_MAX: "17000"
        run: |
          ARG=""
          # Prima volta, prova chiesta a mano o programma cambiato (le impronte vecchie potrebbero non valere più): ricalcolo tutto.
          if [ ! -s precedenti.json ] || [ "${{ github.event.inputs.prova }}" = "true" ] || [ "${{ github.event_name }}" = "push" ]; then ARG="--prova"; fi
          python3 tools/impronte.py out precedenti.json $ARG
      - name: Pubblica sul ramo impronte
        run: |
          cd out
          git init -q -b impronte
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Impronte delle carte $(date -u +%F)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" impronte
