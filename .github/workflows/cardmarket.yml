# Ogni notte scarica il listino pubblico di Cardmarket (Pokémon) e lo pubblica sul ramo "dati", da cui lo legge l'app.
# Il ramo "dati" ha sempre un solo commit: il repository non cresce.
name: Prezzi Cardmarket
on:
  schedule:
    - cron: "37 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [tools/cardmarket.py, .github/workflows/cardmarket.yml]
permissions:
  contents: write
jobs:
  prezzi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scarica e prepara il listino
        run: python3 tools/cardmarket.py out
      - name: Pubblica sul ramo dati
        run: |
          cd out
          git init -q -b dati
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Listino Cardmarket $(date -u +%F)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" dati
