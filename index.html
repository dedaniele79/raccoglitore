<body>
<title>Raccoglitore TCG</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: schede con barra in basso e pulsante Scansiona al centro; edizione → serie → espansione; ogni espansione è un raccoglitore a tasche 3×3 */
:root {
  --bg: #f2f3fa;
  --surface: #ffffff;
  --sunk: #e8eaf5;
  --ink: #161a33;
  --muted: #5c6286;
  --line: #dcdff0;
  --accent: #3b4cca;
  --accent-ink: #ffffff;
  --accent-soft: #e3e6fb;
  --gold: #f5b800;
  --gold-ink: #2a1f00;
  --frame: #f7c724;
  --good: #1f9d5c;
  --warn: #c66a00;
  --bad: #d23f45;
  --e-it: #1f9d5c; --e-en: #2f7de1; --e-ja: #e0454b; --e-ko: #8a52d6; --e-zh: #c99300; --e-other: #6b7196;
  --back-1: #263a9c; --back-2: #1a2670;
  --shadow: 0 1px 2px rgba(22, 26, 51, .06), 0 6px 18px rgba(22, 26, 51, .07);
  --holo: linear-gradient(115deg, #7fd3ff 0%, #b49bff 22%, #ff9ad5 42%, #ffe48a 62%, #8ff0c4 80%, #7fd3ff 100%);
  --font-display: "Baloo 2", "Avenir Next Rounded", "Arial Rounded MT Bold", system-ui, sans-serif;
  --font-body: "Nunito", -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --radius: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c0f22; --surface: #161a36; --sunk: #10132a; --ink: #eef0ff; --muted: #9ba1c9; --line: #272c53;
    --accent: #8d98ff; --accent-ink: #0c0f22; --accent-soft: #232a5c; --gold: #ffd23f; --gold-ink: #2a1f00; --frame: #e7b912;
    --good: #45d18a; --warn: #f2a23c; --bad: #ff7a7f;
    --e-it: #45d18a; --e-en: #5aa0ff; --e-ja: #ff6b70; --e-ko: #b48cff; --e-zh: #f2c230; --e-other: #9ba1c9;
    --back-1: #2a3fae; --back-2: #141c56;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c0f22; --surface: #161a36; --sunk: #10132a; --ink: #eef0ff; --muted: #9ba1c9; --line: #272c53;
  --accent: #8d98ff; --accent-ink: #0c0f22; --accent-soft: #232a5c; --gold: #ffd23f; --gold-ink: #2a1f00; --frame: #e7b912;
  --good: #45d18a; --warn: #f2a23c; --bad: #ff7a7f;
  --e-it: #45d18a; --e-en: #5aa0ff; --e-ja: #ff6b70; --e-ko: #b48cff; --e-zh: #f2c230; --e-other: #9ba1c9;
  --back-1: #2a3fae; --back-2: #141c56;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .35);
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { -webkit-user-select: none; user-select: none; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 8px; }

.app { display: flex; flex-direction: column; min-height: 100%; }
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px 8px; display: flex; align-items: center; gap: 8px;
}
.top h1 { font-family: var(--font-display); font-weight: 800; font-size: 28px; line-height: 1.1; margin: 0; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.icon-btn { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--surface); box-shadow: var(--shadow); display: grid; place-items: center; cursor: pointer; flex: none; }
.icon-btn svg { width: 22px; height: 22px; }
a.icon-btn { color: inherit; text-decoration: none; }
.top .actions { display: flex; gap: 8px; flex: none; }
.notice { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow), inset 4px 0 0 var(--gold); }
.notice .grow b { display: block; }
.steps { display: grid; gap: 12px; margin: 0; padding: 0; list-style: none; counter-reset: step; }
.steps li { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 12px; align-items: start; counter-increment: step; }
.steps li::before { content: counter(step); width: 36px; height: 36px; border-radius: 50%; background: var(--gold); color: var(--gold-ink); font-family: var(--font-display); font-weight: 800; font-size: 18px; display: grid; place-items: center; }
.steps b { display: block; }
.welcome-hero { border-radius: 18px; padding: 18px; color: #fff; background: radial-gradient(120% 90% at 100% 0%, #5468ff 0%, #2a3aa8 45%, #19226b 100%); position: relative; overflow: hidden; }
.welcome-hero::after { content: ""; position: absolute; inset: 0; background: var(--holo); mix-blend-mode: soft-light; opacity: .55; pointer-events: none; }
.welcome-hero > * { position: relative; z-index: 1; }
.welcome-hero h3 { font-family: var(--font-display); font-size: 26px; line-height: 1.1; margin: 0 0 6px; }
.quickadd { display: grid; gap: 10px; padding: 14px; }
.quickadd .btn-row .btn { flex: 1 1 30%; }
.meta-line { font-size: 12px; color: var(--muted); text-align: center; }
main {
  flex: 1; box-sizing: border-box; width: 100%; max-width: 760px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 4px calc(104px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 16px; align-content: start;
}

/* Barra delle schede */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: grid; grid-template-columns: repeat(5, 1fr); align-items: end;
  background: var(--surface); box-shadow: 0 -1px 0 var(--line), 0 -8px 24px rgba(0,0,0,.06);
  padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
}
.tabs button { border: 0; background: none; padding: 9px 2px 8px; display: grid; justify-items: center; gap: 3px; font-size: 11px; font-weight: 700; color: var(--muted); cursor: pointer; min-height: 56px; }
.tabs button svg { width: 24px; height: 24px; }
.tabs button[aria-current="page"] { color: var(--accent); }
.tabs .scan-tab .fab {
  width: 60px; height: 60px; margin-top: -26px; border-radius: 50%; display: grid; place-items: center;
  background: var(--gold); color: var(--gold-ink); box-shadow: 0 0 0 5px var(--surface), 0 6px 16px rgba(245, 184, 0, .45);
}
.tabs .scan-tab .fab svg { width: 30px; height: 30px; }
.tabs .scan-tab[aria-current="page"] { color: var(--ink); }

/* Elementi comuni */
.banner { background: var(--accent-soft); border-radius: 12px; padding: 10px 12px; font-size: 13px; }
.panel { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
.section-title { font-family: var(--font-display); font-weight: 800; font-size: 21px; margin: 4px 2px -6px; display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px; }
.section-title small { font-family: var(--font-body); font-weight: 600; font-size: 13px; color: var(--muted); }
.row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; min-width: 0; min-height: 44px; box-sizing: border-box; }
.row + .row { border-top: 1px solid var(--line); }
button.row, a.row { width: 100%; border: 0; background: none; text-align: left; cursor: pointer; color: inherit; text-decoration: none; }
.grow { flex: 1; min-width: 0; }
.name { font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sub { color: var(--muted); font-size: 13px; }
.num { font-family: var(--font-mono); font-size: 13px; font-variant-numeric: tabular-nums; font-weight: 500; }
.euro { font-variant-numeric: tabular-nums; font-weight: 800; white-space: nowrap; }
.chev { color: var(--muted); font-size: 20px; line-height: 1; }
.note { font-size: 13px; color: var(--muted); margin: 0; }
.note.warn { color: var(--warn); font-weight: 700; }
.empty { text-align: center; padding: 28px 18px; display: grid; gap: 10px; justify-items: center; }
.empty h2 { font-family: var(--font-display); margin: 0; font-size: 22px; }

.btn { border: 0; background: var(--surface); box-shadow: var(--shadow); border-radius: 999px; padding: 10px 18px; font-weight: 800; cursor: pointer; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-align: center; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.gold { background: var(--gold); color: var(--gold-ink); }
.btn.ghost { background: transparent; box-shadow: inset 0 0 0 1.5px var(--line); }
.btn.small { min-height: 34px; padding: 6px 12px; font-size: 13px; }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .5; cursor: default; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; }

.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.chip.dup { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.chip.grade { background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--good); }
.chip.example { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
.chip.ed { background: color-mix(in srgb, var(--rc) 16%, transparent); color: var(--rc); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; background: var(--rc, var(--muted)); }

/* Selettori a pillole */
.seg { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px; margin: -2px; }
.seg::-webkit-scrollbar { display: none; }
.seg button { flex: none; border: 0; border-radius: 999px; padding: 8px 14px; min-height: 38px; background: var(--surface); box-shadow: inset 0 0 0 1.5px var(--line); font-weight: 700; font-size: 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); box-shadow: none; }
.seg button .count { font-size: 12px; opacity: .7; }

/* Carta "trofeo" del riepilogo */
.trophy { position: relative; border-radius: 22px; padding: 7px; background: var(--frame); box-shadow: var(--shadow), 0 10px 30px color-mix(in srgb, var(--frame) 30%, transparent); }
.trophy-inner { position: relative; border-radius: 16px; padding: 16px 16px 14px; overflow: hidden; background: radial-gradient(120% 90% at 100% 0%, #5468ff 0%, #2a3aa8 45%, #19226b 100%); color: #fff; }
.trophy-inner::after { content: ""; position: absolute; inset: 0; background: var(--holo); mix-blend-mode: soft-light; opacity: .55; pointer-events: none; }
.trophy-inner > * { position: relative; z-index: 1; }
.trophy .eyebrow { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; opacity: .85; }
.trophy .big { font-family: var(--font-display); font-weight: 800; font-size: 44px; line-height: 1.05; font-variant-numeric: tabular-nums; }
.trophy .stats { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 14px; }
.trophy .stats b { font-variant-numeric: tabular-nums; font-size: 17px; }
.trophy .delta { display: inline-block; font-weight: 800; font-size: 13px; padding: 2px 8px; border-radius: 999px; background: rgba(255,255,255,.18); margin-top: 8px; }
.trophy .spark { margin-top: 8px; }

.quick { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.quick .btn { width: 100%; }

/* Espansioni */
.serie-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 4px 2px -6px; font-weight: 800; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .07em; }
.set-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 10px; }
.set-tile { display: flex; gap: 12px; align-items: center; padding: 12px 12px 12px 16px; border: 0; background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); text-align: left; cursor: pointer; width: 100%; min-width: 0; color: inherit; position: relative; overflow: hidden; }
.set-tile::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--rc, var(--accent)); }
.set-tile.complete::after { content: ""; position: absolute; inset: 0; background: var(--holo); opacity: .14; pointer-events: none; }
.ring { width: 54px; height: 54px; flex: none; position: relative; display: grid; place-items: center; }
.ring svg { position: absolute; inset: 0; transform: rotate(-90deg); }
.ring b { font-size: 13px; font-variant-numeric: tabular-nums; }

/* Raccoglitore */
.binder-head { padding: 14px; display: grid; gap: 10px; }
.bar { height: 10px; border-radius: 5px; background: var(--sunk); overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--rc, var(--accent)); border-radius: 5px; }
.bar.full > span { background: var(--holo); }
.binder { display: grid; gap: 14px; }
.page { background: linear-gradient(180deg, var(--surface), var(--sunk)); border-radius: 18px; padding: 12px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 9px; box-shadow: var(--shadow); }
.page-label { grid-column: 1 / -1; font-size: 11px; font-weight: 800; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; display: flex; justify-content: space-between; }
.pocket { position: relative; border: 0; padding: 0; background: none; cursor: pointer; display: grid; gap: 4px; min-width: 0; color: inherit; }
.art { aspect-ratio: 245 / 337; max-width: 100%; border-radius: 7px; overflow: hidden; position: relative; background: var(--sunk); }
.art img { position: relative; width: 100%; height: 100%; object-fit: cover; display: block; }
.pocket.owned .art { box-shadow: 0 0 0 2px var(--frame), 0 4px 10px rgba(0,0,0,.15); }
.pocket.missing .art { opacity: .55; }
.pocket.missing .art img { filter: grayscale(1) brightness(1.05); opacity: .45; }
.pocket .count { position: absolute; top: -6px; right: -6px; min-width: 22px; height: 22px; display: grid; place-items: center; background: var(--good); color: #fff; font-size: 12px; font-weight: 800; border-radius: 11px; padding: 0 5px; box-sizing: border-box; box-shadow: 0 0 0 2px var(--surface); z-index: 1; }
.pocket .label { font-size: 11px; color: var(--muted); text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pocket .label.name-l { color: var(--ink); font-weight: 700; }
/* Dorso della carta, quando l'immagine non c'è */
.back { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 8px; box-sizing: border-box; color: #fff;
  background: repeating-linear-gradient(45deg, rgba(255,255,255,.07) 0 6px, transparent 6px 12px), radial-gradient(circle at 50% 45%, var(--back-1), var(--back-2)); }
.back b { display: block; font-size: 12px; line-height: 1.2; overflow-wrap: anywhere; }
.back span { font-family: var(--font-mono); font-size: 11px; opacity: .85; }
.foil .art::after { content: ""; position: absolute; inset: 0; background: var(--holo); mix-blend-mode: color-dodge; opacity: .22; pointer-events: none; }

.grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 12px; }

/* Moduli */
.form { display: grid; gap: 14px; padding: 16px; }
.field { display: grid; gap: 6px; min-width: 0; }
.field > label, .field > .label { font-size: 13px; font-weight: 700; color: var(--muted); }
.field input, .field select, .field textarea, .searchbar input {
  border: 0; box-shadow: inset 0 0 0 1.5px var(--line); background: var(--surface); border-radius: 12px; padding: 10px 12px; width: 100%; box-sizing: border-box; min-width: 0; min-height: 44px;
}
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.check { display: flex; gap: 10px; align-items: center; font-weight: 700; min-height: 44px; }
.check input { width: 22px; height: 22px; accent-color: var(--accent); }
.searchbar { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }

/* Scansione */
.scanner { position: relative; border-radius: 22px; overflow: hidden; background: #05060f; aspect-ratio: 3 / 4; max-height: 52vh; width: 100%; max-width: 100%; margin: 0 auto; box-shadow: var(--shadow); }
.scanner video { width: 100%; height: 100%; object-fit: cover; display: block; }
.scanner .frame { position: absolute; left: 50%; top: 50%; width: 66%; aspect-ratio: 245 / 337; transform: translate(-50%, -50%); border-radius: 14px; box-shadow: 0 0 0 999px rgba(5, 6, 15, .45); }
.scanner .frame::before { content: ""; position: absolute; inset: 0; border-radius: 14px; border: 3px solid var(--frame); }
.scanner .frame .numzone { position: absolute; left: 6px; right: 6px; bottom: 6px; height: 15%; border-radius: 8px; border: 2px dashed rgba(255,255,255,.75); }
.scanner.reading .frame::before { animation: pulse 1.2s ease-in-out infinite; }
.scanner.hit .frame::before { border-color: var(--good); }
@keyframes pulse { 50% { opacity: .45; } }
@media (prefers-reduced-motion: reduce) { .scanner.reading .frame::before { animation: none; } }
.scanner .status { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); background: rgba(5,6,15,.72); color: #fff; font-weight: 700; font-size: 13px; padding: 7px 14px; border-radius: 999px; white-space: nowrap; max-width: calc(100% - 24px); overflow: hidden; text-overflow: ellipsis; box-sizing: border-box; }
.scanner .controls { position: absolute; left: 12px; right: 12px; bottom: 12px; display: flex; justify-content: space-between; gap: 8px; }
.scanner .controls .btn { background: rgba(5,6,15,.72); color: #fff; box-shadow: none; }
.scanner .controls .btn.gold { background: var(--gold); color: var(--gold-ink); }
.scanner .demo-cam { position: absolute; inset: 0; background: radial-gradient(60% 50% at 50% 50%, #3a3f5c 0%, #15182b 70%), #15182b; }
.scanner .demo-cam::after { content: ""; position: absolute; left: 50%; top: 50%; width: 60%; aspect-ratio: 245 / 337; transform: translate(-50%, -50%) rotate(-2deg); border-radius: 10px; background: linear-gradient(160deg, #f7c724 0 6%, #e8edf7 6% 94%, #f7c724 94%); box-shadow: 0 10px 30px rgba(0,0,0,.5); opacity: .9; }
.scanner.off { display: grid; place-items: center; color: #cfd5f5; padding: 24px; text-align: center; aspect-ratio: 4 / 3; }
.scanner.off .inner { display: grid; gap: 12px; justify-items: center; }
.session-bar .field > .label { display: flex; justify-content: space-between; gap: 8px; }
.picker { padding: 14px; display: grid; gap: 10px; box-shadow: var(--shadow), inset 0 0 0 2px var(--gold); }
.picker .options { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
.tray-item { display: flex; gap: 12px; align-items: center; padding: 10px 12px; min-width: 0; }
.tray-item + .tray-item { border-top: 1px solid var(--line); }
.tray-item .thumb { width: 46px; flex: none; }
.tray-item.new { animation: flash 1.2s ease-out; }
@keyframes flash { from { background: color-mix(in srgb, var(--gold) 35%, transparent); } }
@media (prefers-reduced-motion: reduce) { .tray-item.new { animation: none; } }
.tray-actions { display: flex; gap: 6px; flex: none; }

/* Scheda carta */
.sheet-wrap { position: fixed; inset: 0; z-index: 20; background: rgba(5, 6, 15, .55); display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  background: var(--bg); width: 100%; max-width: 640px; max-height: 94%; overflow-y: auto; border-radius: 24px 24px 0 0; box-sizing: border-box;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px calc(28px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 16px;
}
.grab { width: 44px; height: 5px; border-radius: 3px; background: var(--line); justify-self: center; }

<script>
"use strict";
// ================================================================ Dati fissi
// L'edizione è la lingua di stampa: IT, EN, JP, KR, CN… come nei negozi. Le edizioni occidentali condividono le espansioni.
const LANGS = [
  ["it","Italiano","IT","intl","it"],["en","Inglese","EN","intl","en"],["fr","Francese","FR","intl","other"],["de","Tedesco","DE","intl","other"],
  ["es","Spagnolo","ES","intl","other"],["pt","Portoghese","PT","intl","other"],["ja","Giapponese","JP","jp","ja"],["ko","Coreano","KR","kr","ko"],
  ["zh-cn","Cinese semplificato","CN","cn","zh"],["zh-tw","Cinese tradizionale","TW","cn","zh"],["th","Thailandese","TH","sea","other"],["id","Indonesiano","ID","sea","other"]
].map(([code,name,short,region,color]) => ({code,name,short,region,color}));
const LANG = Object.fromEntries(LANGS.map(l => [l.code, l]));
const EDITION_ORDER = ["it","en","ja","ko","zh-cn","zh-tw","fr","de","es","pt","th","id"];
const VARIANTS = { normal: "Normale", reverse: "Reverse", holo: "Holo", firstEdition: "1ª ed." };
const CONDITIONS = [["MT","Mint"],["NM","Near Mint"],["EX","Excellent"],["GD","Good"],["LP","Light Played"],["PL","Played"],["PO","Poor"]];
const GRADERS = ["PSA","BGS","CGC","SGC","Altro"];
const RARITY_IT = {
  "common": "Comune", "uncommon": "Non comune", "rare": "Rara", "rare holo": "Rara holo", "holo rare": "Rara holo",
  "double rare": "Doppia rara", "ultra rare": "Ultra rara", "illustration rare": "Rara illustrazione",
  "special illustration rare": "Rara illustrazione speciale", "hyper rare": "Iper rara", "shiny rare": "Rara cromatica",
  "shiny ultra rare": "Ultra rara cromatica", "ace spec rare": "Rara ACE SPEC", "secret rare": "Rara segreta", "promo": "Promo",
  "amazing rare": "Rara straordinaria", "radiant rare": "Rara radiosa", "rare holo v": "Rara holo V", "rare holo vmax": "Rara holo VMAX",
  "rare holo vstar": "Rara holo VSTAR", "rare ultra": "Ultra rara", "rare secret": "Rara segreta", "rare rainbow": "Rara arcobaleno",
  "mega hyper rare": "Mega iper rara", "black white rare": "Rara bianco e nero"
};
const APP_VERSION = "1.3";
const APP_DATE = "31 ottobre 2026";
const GUIDE_URL = "https://claude.ai/artifact/3jA4rPapgx1RR4ZWzeLEEr";
const API = "https://api.tcgdex.net/v2";
// Lettore del numero (Tesseract.js 5.1.1): i file sono nella cartella ocr/ dell'app, non su server di terzi.
const OCR_DIR = new URL("ocr/", location.href).href;

const fallbackLang = code => LANG[code]?.region === "intl" ? "en" : code;
const regionOf = code => LANG[code]?.region || "intl";
const edColor = code => `var(--e-${LANG[code]?.color || "other"})`;
const edStyle = code => `style="--rc:${edColor(code)}"`;
const edName = code => LANG[code]?.name || code;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const euro = v => v == null || isNaN(v) ? "—" : new Intl.NumberFormat("it-IT", { style: "currency", currency: "EUR" }).format(v);
const today = () => new Date().toISOString().slice(0, 10);
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const itDate = d => d ? new Date(d + "T12:00:00").toLocaleDateString("it-IT", { day: "numeric", month: "long", year: "numeric" }) : "";
const rarityIt = r => RARITY_IT[String(r || "").toLowerCase()] || r || "";
// Numero come stampato: 006/165 (zeri a sinistra quando il numero è solo cifre)
function cardNumber(localId, official) {
  const id = String(localId ?? "");
  if (!official) return id;
  const w = Math.max(3, String(official).length);
  return `${/^\d+$/.test(id) ? id.padStart(w, "0") : id}/${String(official).padStart(w, "0")}`;
}

// ================================================================ Stato e salvataggio sul telefono (IndexedDB)
let state = { cards: {}, sets: {}, copies: [], snapshots: [], settings: { lang: "it", cond: "NM", coef: {} }, lastRefresh: 0 };
const Store = {
  db: null,
  open() {
    return new Promise(resolve => {
      try {
        const req = indexedDB.open("raccoglitore-tcg", 1);
        req.onupgradeneeded = () => req.result.createObjectStore("kv");
        req.onsuccess = () => { this.db = req.result; resolve(); };
        req.onerror = () => resolve();
      } catch { resolve(); }
    });
  },
  async load() {
    await this.open();
    if (!this.db) { try { const raw = localStorage.getItem("raccoglitore-tcg"); return raw ? JSON.parse(raw) : null; } catch { return null; } }
    return new Promise(resolve => {
      try {
        const r = this.db.transaction("kv").objectStore("kv").get("state");
        r.onsuccess = () => resolve(r.result || null);
        r.onerror = () => resolve(null);
      } catch { resolve(null); }
    });
  },
  keep(name, data) {
    try { if (this.db) this.db.transaction("kv", "readwrite").objectStore("kv").put(data, name); } catch {}
  },
  timer: null,
  save() {
    clearTimeout(this.timer);
    this.timer = setTimeout(() => {
      const data = JSON.parse(JSON.stringify(state));
      try {
        if (this.db) this.db.transaction("kv", "readwrite").objectStore("kv").put(data, "state");
        else localStorage.setItem("raccoglitore-tcg", JSON.stringify(data));
      } catch (e) { console.warn("Salvataggio non riuscito", e); }
    }, 250);
  }
};

// ================================================================ Controllo dei dati
// Una copia di sicurezza è un file che arriva da fuori: la collezione viene ricostruita campo per campo,
// tenendo solo tipi e valori previsti. Testi troppo lunghi vengono accorciati, indirizzi di immagini estranei scartati.
const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
const ASSET_RE = /^https:\/\/assets\.tcgdex\.net\/[A-Za-z0-9._\-\/]{1,200}$/;
const COND_CODES = CONDITIONS.map(([c]) => c);
const own = (o, k) => Object.prototype.hasOwnProperty.call(o, k);
const isObj = o => !!o && typeof o === "object" && !Array.isArray(o);
const txt = (v, max) => (typeof v === "string" || typeof v === "number") ? String(v).replace(/[\u0000-\u0008\u000b-\u001f\u007f]/g, "").slice(0, max) : "";
const numIn = (v, min, max) => {
  const n = typeof v === "number" ? v : typeof v === "string" && v.trim() !== "" ? Number(v.trim().replace(",", ".")) : NaN;
  return Number.isFinite(n) && n >= min && n <= max ? n : null;
};
const langOk = v => typeof v === "string" && own(LANG, v) ? v : null;

function cleanCard(c) {
  if (!isObj(c)) return null;
  const lang = langOk(c.lang), id = txt(c.id, 100);
  if (!lang || !id) return null;
  const v = isObj(c.variants) ? c.variants : {};
  const variants = { normal: v.normal === true, reverse: v.reverse === true, holo: v.holo === true, firstEdition: v.firstEdition === true };
  if (!Object.values(variants).some(Boolean)) variants.normal = true;
  const cm = isObj(c.cm) ? c.cm : {};
  const price = k => numIn(cm[k], 0, 1e6);
  return {
    key: `${lang}|${id}`, id, lang, name: txt(c.name, 120), localId: txt(c.localId, 20), setId: txt(c.setId, 60), setName: txt(c.setName, 120),
    official: numIn(c.official, 0, 5000) ?? 0, rarity: txt(c.rarity, 60), illustrator: txt(c.illustrator, 80),
    image: ASSET_RE.test(c.image) ? c.image : "", variants, example: c.example === true,
    cm: { trend: price("trend"), avg30: price("avg30"), low: price("low"), trendHolo: price("trendHolo"), avg30Holo: price("avg30Holo"),
          lowHolo: price("lowHolo"), updated: DATE_RE.test(cm.updated) ? cm.updated : null },
    fetched: numIn(c.fetched, 0, 1e14) ?? 0
  };
}
function cleanSet(s) {
  if (!isObj(s)) return null;
  const lang = langOk(s.lang), id = txt(s.id, 60);
  if (!lang || !id) return null;
  return {
    key: `${lang}|${id}`, id, lang, name: txt(s.name, 120), serieId: txt(s.serieId, 60) || "altro", serieName: txt(s.serieName, 120) || "Altro",
    release: DATE_RE.test(s.release) ? s.release : "", official: numIn(s.official, 0, 5000) ?? 0, total: numIn(s.total, 0, 5000) ?? 0,
    logo: ASSET_RE.test(s.logo) ? s.logo : "", fetched: numIn(s.fetched, 0, 1e14) ?? 0
  };
}
function cleanCopy(c, cards, seen) {
  if (!isObj(c)) return null;
  const cardKey = txt(c.cardKey, 120);
  if (!own(cards, cardKey)) return null;
  let id = txt(c.id, 100);
  if (!id || seen.has(id)) id = uid();
  seen.add(id);
  const graded = c.graded === true;
  const copy = {
    id, added: numIn(c.added, 0, 1e14) ?? Date.now(), cardKey, lang: langOk(c.lang) || cards[cardKey].lang,
    variant: own(VARIANTS, c.variant) ? c.variant : "normal", cond: COND_CODES.includes(c.cond) ? c.cond : "NM",
    graded, grader: GRADERS.includes(c.grader) ? c.grader : null, grade: txt(c.grade, 10) || null,
    purchase: numIn(c.purchase, 0, 1e7), personal: numIn(c.personal, 0, 1e7), location: txt(c.location, 120), notes: txt(c.notes, 1000)
  };
  if (c.example === true) copy.example = true;
  return copy;
}
// Restituisce la collezione pulita e quante copie sono state scartate. Rifiuta ciò che non è una copia di sicurezza.
function sanitizeState(raw) {
  if (!isObj(raw) || !Array.isArray(raw.copies) || !isObj(raw.cards)) throw new Error("Formato non valido");
  const cards = {}, sets = {}, seen = new Set();
  for (const c of Object.values(raw.cards).slice(0, 50000)) { const k = cleanCard(c); if (k) cards[k.key] = k; }
  if (isObj(raw.sets)) for (const s of Object.values(raw.sets).slice(0, 5000)) { const k = cleanSet(s); if (k) sets[k.key] = k; }
  const copies = raw.copies.slice(0, 50000).map(c => cleanCopy(c, cards, seen)).filter(Boolean);
  const snapshots = (Array.isArray(raw.snapshots) ? raw.snapshots : []).filter(s => isObj(s) && DATE_RE.test(s.day))
    .map(s => ({ day: s.day, value: numIn(s.value, 0, 1e9) ?? 0, copies: numIn(s.copies, 0, 1e6) ?? 0 })).slice(-400);
  const st = isObj(raw.settings) ? raw.settings : {};
  const coef = {};
  if (isObj(st.coef)) for (const [k, v] of Object.entries(st.coef)) { const n = numIn(v, 0.01, 10); if (langOk(k) && n != null) coef[k] = n; }
  const settings = { lang: langOk(st.lang) || "it", cond: COND_CODES.includes(st.cond) ? st.cond : "NM", coef,
    onboarded: st.onboarded === true, installDismissed: st.installDismissed === true };
  if (langOk(st.scanLang)) settings.scanLang = st.scanLang;
  const clean = { cards, sets, copies, snapshots, settings, lastRefresh: numIn(raw.lastRefresh, 0, 1e14) ?? 0 };
  const lb = numIn(raw.lastBackup, 0, 1e14); if (lb) clean.lastBackup = lb;
  return { state: clean, dropped: raw.copies.length - copies.length };
}

// ================================================================ Catalogo TCGdex
let online = true;
// Nell'anteprima dentro Claude il catalogo online è bloccato: lì si usano dati di esempio. Nell'app vera mai.
const isPreview = !document.querySelector('link[rel="manifest"]');
class NotFound extends Error {}
const memo = new Map();
async function api(lang, path, params) {
  if (!online) return demoApi(lang, path, params);
  const url = new URL(`${API}/${lang}/${path}`);
  for (const [k, v] of Object.entries(params || {})) url.searchParams.set(k, v);
  const key = url.toString();
  if (memo.has(key)) return memo.get(key);
  const p = (async () => {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), 15000);
    try {
      const r = await fetch(url, { signal: ctrl.signal });
      if (r.status === 404) throw new NotFound("Non trovato nel catalogo");
      if (!r.ok) throw new Error("Il catalogo ha risposto con errore " + r.status);
      return await r.json();
    } catch (e) {
      if (e.name === "AbortError") throw new Error("Il catalogo non risponde: controlla la connessione");
      if (e instanceof TypeError) throw new Error("Nessuna connessione al catalogo");
      throw e;
    } finally { clearTimeout(t); }
  })();
  memo.set(key, p);
  p.catch(() => memo.delete(key));
  if (memo.size > 400) memo.delete(memo.keys().next().value);
  return p;
}
async function checkOnline() {
  try {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), 5000);
    const r = await fetch(`${API}/en/series/sv`, { signal: ctrl.signal });
    clearTimeout(t);
    online = r.ok;
  } catch { online = false; }
}
const imgUrl = (base, high) => base ? `${base}/${high ? "high" : "low"}.webp` : "";

function cardFromApi(c, lang) {
  const cm = c.pricing?.cardmarket || {};
  const v = c.variants || {};
  const variants = { normal: !!v.normal, reverse: !!v.reverse, holo: !!v.holo, firstEdition: !!v.firstEdition };
  if (!Object.values(variants).some(Boolean)) variants.normal = true;
  return {
    key: `${lang}|${c.id}`, id: c.id, lang, name: c.name, localId: String(c.localId), setId: c.set?.id || "",
    setName: c.set?.name || "", official: c.set?.cardCount?.official || 0, rarity: c.rarity || "", illustrator: c.illustrator || "",
    image: c.image || "", variants, example: !!c.example,
    cm: { trend: cm.trend ?? null, avg30: cm.avg30 ?? null, low: cm.low ?? null, trendHolo: cm["trend-holo"] ?? null,
          avg30Holo: cm["avg30-holo"] ?? null, lowHolo: cm["low-holo"] ?? null, updated: cm.updated ? String(cm.updated).slice(0, 10) : null },
    fetched: Date.now()
  };
}
function storeSet(d, lang) {
  const key = `${lang}|${d.id}`;
  state.sets[key] = { key, id: d.id, lang, name: d.name, serieId: d.serie?.id || "altro", serieName: d.serie?.name || "Altro",
    release: d.releaseDate || "", official: d.cardCount?.official || 0, total: d.cardCount?.total || d.cardCount?.official || 0,
    logo: d.logo || "", fetched: Date.now() };
  Store.save();
  return state.sets[key];
}
async function ensureSet(setId, lang) {
  const s = state.sets[`${lang}|${setId}`];
  if (s && Date.now() - s.fetched < 30 * 864e5) return s;
  return storeSet(await api(lang, `sets/${encodeURIComponent(setId)}`), lang);
}
async function loadCard(id, lang, force) {
  const fresh = c => c && !force && Date.now() - c.fetched < 12 * 3600e3;
  if (fresh(state.cards[`${lang}|${id}`])) return state.cards[`${lang}|${id}`];
  let used = lang, data;
  try { data = await api(lang, `cards/${encodeURIComponent(id)}`); }
  catch (e) {
    if (!(e instanceof NotFound) || fallbackLang(lang) === lang) throw e;
    used = fallbackLang(lang);
    if (fresh(state.cards[`${used}|${id}`])) return state.cards[`${used}|${id}`];
    data = await api(used, `cards/${encodeURIComponent(id)}`);
  }
  const card = cardFromApi(data, used);
  state.cards[card.key] = card;
  ensureSet(card.setId, used).catch(() => {});
  Store.save();
  return card;
}

// ================================================================ Valore e doppioni
function marketPrice(card, variant) {
  if (!card) return null;
  const foil = variant === "reverse" || (variant === "holo" && card.variants.normal);
  return foil ? (card.cm.trendHolo ?? card.cm.avg30Holo) : (card.cm.trend ?? card.cm.avg30);
}
const coef = lang => state.settings.coef[lang] ?? 1;
function copyValue(cp) {
  if (cp.personal != null) return cp.personal;
  const p = marketPrice(state.cards[cp.cardKey], cp.variant);
  return p == null ? 0 : p * coef(cp.lang);
}
const total = list => list.reduce((s, c) => s + copyValue(c), 0);
const cardOf = cp => state.cards[cp.cardKey];
function duplicateIds(list) {
  const order = CONDITIONS.map(c => c[0]);
  const groups = {};
  for (const c of list) (groups[`${cardOf(c)?.id}|${c.lang}|${c.variant}`] ||= []).push(c);
  const ids = new Set();
  for (const g of Object.values(groups)) {
    if (g.length < 2) continue;
    g.sort((a, b) => (b.graded - a.graded) || (order.indexOf(a.cond) - order.indexOf(b.cond)) || (a.added - b.added));
    g.slice(1).forEach(c => ids.add(c.id));
  }
  return ids;
}
function recordSnapshot() {
  const day = today(), value = total(state.copies);
  const existing = state.snapshots.find(s => s.day === day);
  if (existing) { existing.value = value; existing.copies = state.copies.length; }
  else state.snapshots.push({ day, value, copies: state.copies.length });
  state.snapshots = state.snapshots.slice(-400);
  Store.save();
}
async function refreshPrices(onProgress) {
  const keys = [...new Set(state.copies.map(c => c.cardKey))];
  let ok = 0, ko = 0;
  for (let i = 0; i < keys.length; i += 6) {
    await Promise.all(keys.slice(i, i + 6).map(async key => {
      const c = state.cards[key];
      if (!c) { ko++; return; }
      try {
        memo.delete(`${API}/${c.lang}/cards/${encodeURIComponent(c.id)}`);
        const fresh = cardFromApi(await api(c.lang, `cards/${encodeURIComponent(c.id)}`), c.lang);
        c.cm = fresh.cm; c.fetched = Date.now(); ok++;
      } catch { ko++; }
    }));
    onProgress && onProgress(Math.min(i + 6, keys.length), keys.length);
  }
  if (ko < Math.max(1, keys.length / 2)) state.lastRefresh = Date.now();
  recordSnapshot();
  return { ok, ko };
}

// ================================================================ Dal numero stampato alla carta
function parseNumber(text) {
  const m = String(text).toUpperCase().replace(/[|\\]/g, "/").match(/(?<![0-9A-Z])([A-Z]{0,3}[0-9]{1,3})\s?[\/-]\s?([0-9]{2,3})(?![0-9])/);
  if (m) {
    const n = parseInt(m[1].replace(/\D/g, ""), 10), t = parseInt(m[2], 10);
    if (isNaN(n) || isNaN(t) || n === 0 || n > t + 150) return null;
    return { number: m[1], total: t };
  }
  const plain = String(text).trim();
  return /^[A-Z0-9]{1,8}$/i.test(plain) ? { number: plain, total: null } : null;
}
const numLabel = p => p.total ? cardNumber(p.number, p.total) : p.number;
function lookupForms(num) {
  const forms = [num];
  const trimmed = num.replace(/^0+/, "");
  if (trimmed && trimmed !== num) forms.push(trimmed);
  if (/^\d+$/.test(num)) for (const p of [num.padStart(3, "0"), num.padStart(2, "0")]) if (!forms.includes(p)) forms.push(p);
  return forms;
}
const setIndexCache = {};
function setIndex(lang) {
  return setIndexCache[lang] ||= api(lang, "sets").then(list => Object.fromEntries(list.map(s => [s.id, s]))).catch(() => { delete setIndexCache[lang]; return {}; });
}
const setIdOf = b => b.id.endsWith("-" + b.localId) ? b.id.slice(0, -(String(b.localId).length + 1)) : b.id.replace(/-[^-]*$/, "");
const findCache = new Map();
async function findByNumber(printed, lang) {
  const ck = `${lang}|${numLabel(printed)}`;
  if (findCache.has(ck)) return findCache.get(ck);
  const attempt = async l => {
    const lists = await Promise.all(lookupForms(printed.number).map(f => api(l, "cards", { localId: "eq:" + f }).catch(() => [])));
    const seen = new Map();
    lists.flat().forEach(b => seen.set(b.id, { ...b, localId: String(b.localId) }));
    let briefs = [...seen.values()];
    const idx = await setIndex(l);
    if (printed.total) {
      const same = briefs.filter(b => idx[setIdOf(b)]?.cardCount?.official === printed.total);
      if (same.length) briefs = same;
    }
    return { lang: l, items: briefs.slice(0, 30).map(b => ({ ...b, setId: setIdOf(b), setName: idx[setIdOf(b)]?.name || setIdOf(b), official: idx[setIdOf(b)]?.cardCount?.official || 0 })) };
  };
  let res = await attempt(lang);
  if (!res.items.length && fallbackLang(lang) !== lang) res = await attempt(fallbackLang(lang));
  findCache.set(ck, res);
  return res;
}

function valueDelta() {
  const s = state.snapshots;
  if (s.length < 2) return "";
  const now = s[s.length - 1].value;
  const ref = s.find(x => x.day >= new Date(Date.now() - 30 * 864e5).toISOString().slice(0, 10)) || s[0];
  if (!ref.value || ref === s[s.length - 1]) return "";
  const d = (now - ref.value) / ref.value;
  return `<span class="delta">${d >= 0 ? "▲" : "▼"} ${Math.abs(d * 100).toFixed(1).replace(".", ",")}% in 30 giorni</span>`;
}

// Ritaglia la fascia del numero dentro la cornice e la prepara per la lettura (grigio e contrasto).
function cropNumberStrip(src, w, h) {
  const fw = w * 0.66, fh = Math.min(h, fw * 337 / 245);
  const x0 = (w - fw) / 2, y0 = (h - fh) / 2;
  const sy = Math.max(0, y0 + fh * 0.83), sh = Math.max(1, Math.min(fh * 0.17, h - sy));
  const scale = Math.min(2, 1000 / fw);
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(fw * scale)); c.height = Math.max(1, Math.round(sh * scale));
  const ctx = c.getContext("2d", { willReadFrequently: true });
  ctx.drawImage(src, x0, sy, fw, sh, 0, 0, c.width, c.height);
  const img = ctx.getImageData(0, 0, c.width, c.height), p = img.data;
  let sum = 0;
  for (let i = 0; i < p.length; i += 4) { const g = 0.3 * p[i] + 0.59 * p[i + 1] + 0.11 * p[i + 2]; p[i] = g; sum += g; }
  const mean = sum / (p.length / 4);
  for (let i = 0; i < p.length; i += 4) { const v = Math.max(0, Math.min(255, (p[i] - mean) * 1.8 + 128)); p[i] = p[i + 1] = p[i + 2] = v; }
  ctx.putImageData(img, 0, 0);

}

function handleRead(p) {

  if (!items.length) { setScanStatus(`Nessuna carta ${numLabel(p)} in ${edName(scan.lang).toLowerCase()}`, ""); beep(false); return; }

function sparkline(points) {
  if (points.length < 2) return "";
  const vals = points.map(p => p.value);
  const min = Math.min(...vals), max = Math.max(...vals), span = max - min || 1;
  const W = 300, H = 64, pad = 5;
  const xy = points.map((p, i) => [pad + i * (W - 2 * pad) / (points.length - 1), H - pad - (p.value - min) / span * (H - 2 * pad)]);
  const line = xy.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  const last = xy[xy.length - 1];
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="Andamento del valore"><path d="${line} L${last[0].toFixed(1)} ${H} L${pad} ${H} Z" fill="rgba(255,255,255,.18)"/><path d="${line}" fill="none" stroke="#ffffff" stroke-width="2.5" vector-effect="non-scaling-stroke"/><circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="4" fill="#ffd23f"/></svg>`;
}

function csv(list) {
  const ids = duplicateIds(state.copies);
  const num = v => v == null ? "" : v.toFixed(2).replace(".", ",");
  // Un testo che inizia con = + - @ verrebbe eseguito da Excel come formula: lo apro con un apostrofo (gli importi restano numeri).
  const q = v => {
    let s = String(v ?? "");
    if (/^[=+\-@\t\r]/.test(s) && !/^-?\d+(,\d+)?$/.test(s)) s = "'" + s;
    return /[;"\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  };
  const rows = [["Carta","Espansione","Numero","Rarità","ID TCGdex","Edizione","Variante","Condizione","Gradata","Voto","Doppione","Valore EUR","Prezzo acquisto EUR","Posizione","Note"]];
  for (const c of list) {
    const card = cardOf(c) || {};
    rows.push([card.name, card.setName, cardNumber(card.localId, card.official), rarityIt(card.rarity), card.id, LANG[c.lang]?.short, VARIANTS[c.variant],
      c.cond, c.graded ? "Sì" : "No", c.graded ? `${c.grader || ""} ${c.grade || ""}`.trim() : "", ids.has(c.id) ? "Sì" : "No",
      num(copyValue(c)), num(c.purchase), c.location, c.notes].map(q));
  }
  return "﻿" + rows.map(r => r.join(";")).join("\n");
}
async function shareFile(name, text, type) {
  const file = new File([text], name, { type });
  try { if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return true; } }
  catch (e) { if (e.name === "AbortError") return false; }
  if (isPreview) { toast("Nell'anteprima i file non si possono salvare"); return false; }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(file); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  return true;
}

document.addEventListener("click", async e => {
  const segBtn = e.target.closest("[data-seg]");
  if (segBtn) {
    const id = segBtn.dataset.seg, v = segBtn.dataset.value;
    if (id === "ed-filter") { ui.edFilter = v; render(); }
    else if (id === "sort-sets") { ui.sort = v; render(); }
    else if (id === "welcome-ed") { state.settings.lang = v; state.settings.scanLang = v; scan.lang = null; Store.save(); document.querySelectorAll('[data-seg="welcome-ed"]').forEach(b => b.setAttribute("aria-pressed", b === segBtn)); }
    else if (id === "binder-filter") { ui.setView.filter = v; render(); }
    else if (id === "browse-ed") { ui.browse.ed = v; render(); }
    else if (id === "search-ed") { ui.search.lang = v; if (ui.search.q) doSearch(); else render(); }
    else if (id === "scan-variant") { scan.variant = v; document.querySelectorAll('[data-seg="scan-variant"]').forEach(b => b.setAttribute("aria-pressed", b === segBtn)); }
    else if (id === "f-variant" || id === "f-cond" || id === "f-lang") { readForm(); sheet.form[{ "f-variant": "variant", "f-cond": "cond", "f-lang": "lang" }[id]] = v; drawSheet(); }
    return;
  }
  const el = e.target.closest("[data-action],[data-tab]");
  if (!el) return;
  const a = el.dataset.action;
  if (!a && el.dataset.tab) { ui.tab = el.dataset.tab; ui.setView = null; ui.browse = null; window.scrollTo(0, 0); render(); return; }
  switch (a) {
    case "browse": ui.browse = { ed: state.settings.lang && ["it","en","ja","ko","zh-cn","zh-tw"].includes(state.settings.lang) ? state.settings.lang : "it", serie: null }; render(); break;
    case "open-serie": ui.browse.serie = { id: el.dataset.id, name: el.dataset.name }; window.scrollTo(0, 0); render(); break;
    case "open-set": ui.setView = { setId: el.dataset.set, lang: el.dataset.lang, ed: el.dataset.ed || el.dataset.lang, filter: "all" }; ui.tab = "collection"; window.scrollTo(0, 0); render(); break;
    case "open-card": openCard(el.dataset.id, el.dataset.lang, el.dataset.ed); break;
    case "close-sheet": if (e.target === el) closeSheet(); break;
    case "close-sheet-btn": closeSheet(); break;
    case "new-copy": {
      const c = sheet.card, region = regionOf(c.lang);
      const pref = regionOf(sheet.ed) === region ? sheet.ed : (regionOf(state.settings.lang) === region ? state.settings.lang : c.lang);
      sheet.form = { lang: pref, variant: Object.keys(c.variants).find(k => c.variants[k]) || "normal", cond: state.settings.cond, graded: false, grader: "PSA" };
      drawSheet(); $("#copy-form")?.scrollIntoView({ behavior: "smooth", block: "start" }); break;
    }
    case "edit-copy": { const cp = state.copies.find(x => x.id === el.dataset.copy); sheet.form = { ...cp, grader: cp.grader || "PSA" }; drawSheet(); $("#copy-form")?.scrollIntoView({ block: "start" }); break; }
    case "delete-copy":
      if (!sheet.form.confirmDelete) { readForm(); sheet.form.confirmDelete = true; drawSheet(); break; }
      state.copies = state.copies.filter(cp => cp.id !== el.dataset.copy); scan.session = scan.session.filter(cp => cp.id !== el.dataset.copy);
      recordSnapshot(); sheet.form = null; toast("Copia eliminata"); drawSheet(); break;
    case "toggle-pause": scan.paused = !scan.paused; el.textContent = scan.paused ? "Riprendi" : "Pausa"; setScanStatus(scan.paused ? "In pausa" : "Inquadra la carta: leggo il numero", ""); break;
    case "toggle-auto": scan.auto = !scan.auto; el.classList.toggle("gold", scan.auto); el.setAttribute("aria-pressed", scan.auto); el.textContent = `Aggiunta automatica: ${scan.auto ? "sì" : "no"}`; break;
    case "pick": { const b = scan.pending?.items.find(x => x.id === el.dataset.id); if (!b) break; const l = scan.pending.lang; scan.pending = null; await addFromScan(b, l); break; }
    case "skip-pending": scan.pending = null; renderScanPanels(); setScanStatus("Inquadra la carta: leggo il numero", ""); break;
    case "cycle-variant": {
      const c = state.copies.find(x => x.id === el.dataset.copy), card = cardOf(c);
      const opts = Object.keys(card.variants).filter(k => card.variants[k]);
      c.variant = opts[(opts.indexOf(c.variant) + 1) % opts.length] || c.variant;
      recordSnapshot(); renderScanPanels(); break;
    }
    case "remove-copy": removeCopy(el.dataset.copy); break;
    case "unlock-set": scan.lockSet = null; render(); break;
    case "scan-this-set": scan.lockSet = { id: el.dataset.set, name: el.dataset.name }; scan.lang = el.dataset.ed; findCache.clear(); ui.tab = "scan"; ui.setView = null; window.scrollTo(0, 0); render(); break;
    case "simulate": {
      const pool = DEMO.cards.filter(c => (c.set.id === "SV2a") === (scan.lang === "ja") && (!scan.lockSet || c.set.id === scan.lockSet.id));
      const c = pool[Math.floor(Math.random() * pool.length)];
      if (!c) { toast("Nessuna carta di esempio per questa edizione"); break; }
      setScanStatus(`Letto ${cardNumber(c.localId, c.set.cardCount.official)}`, "hit");
      acceptNumber({ number: c.localId, total: c.set.cardCount.official }); break;
    }
    case "refresh": {
      if (!online) { toast("Nell'anteprima i prezzi non si aggiornano"); break; }
      el.disabled = true; el.textContent = "Aggiorno…";
      const r = await refreshPrices((d, t) => { el.textContent = `Aggiorno ${d} di ${t}…`; });
      toast(r.ko ? `${r.ok} prezzi aggiornati, ${r.ko} non riusciti` : `${r.ok} prezzi aggiornati`); render(); break;
    }
    case "backup":
      if (await shareFile(`raccoglitore-tcg-${today()}.json`, JSON.stringify(state), "application/json")) { state.lastBackup = Date.now(); Store.save(); toast("Copia di sicurezza salvata"); if (!sheet) render(); }
      break;
    case "open-settings": openSettings(); break;
    case "show-welcome": openWelcome(); break;
    case "welcome-done": closeSheet(); break;
    case "dismiss-install": state.settings.installDismissed = true; Store.save(); render(); break;
    case "quick-add": {
      const c = sheet.card, ed = quickEd(c);
      let target = c;
      if (ed !== c.lang) target = await loadCard(c.id, ed).catch(() => c);
      const copy = { id: uid(), added: Date.now(), cardKey: target.key, lang: ed, variant: el.dataset.variant, cond: state.settings.cond, graded: false, grader: null, grade: null, purchase: null, personal: null, location: "", notes: "" };
      state.copies.push(copy);
      recordSnapshot();
      toast(`+1 ${target.name} ${VARIANTS[copy.variant]}`, () => { state.copies = state.copies.filter(x => x.id !== copy.id); recordSnapshot(); if (sheet?.card) drawSheet(); });
      drawSheet(); break;
    }
    case "csv-dups": { const ids = duplicateIds(state.copies); shareFile("doppioni.csv", csv(state.copies.filter(c => ids.has(c.id))), "text/csv"); break; }
    case "csv-all": shareFile("collezione.csv", csv(state.copies), "text/csv"); break;
  }
});
$("#settings-btn").onclick = () => openSettings();
$("#back").onclick = () => {
  if (ui.setView) ui.setView = null;
  else if (ui.browse?.serie) ui.browse.serie = null;
  else ui.browse = null;
  render();
};
document.addEventListener("keydown", e => { if (e.key === "Escape" && sheet) closeSheet(); });
document.addEventListener("visibilitychange", () => { if (document.hidden) stopScanner(); else if (ui.tab === "scan" && !scan.cameraOff) startScanner(); });

function demoApi(lang, path, params) {
  const brief = c => ({ id: c.id, localId: c.localId, name: c.name, image: "" });
  const isJp = lang === "ja";
  const pool = DEMO.cards.filter(c => (c.set.id === "SV2a") === isJp);
  const [kind, rawId] = path.split("/");
  const id = rawId ? decodeURIComponent(rawId) : null;
  if (kind === "cards" && id) { const c = DEMO.cards.find(x => x.id === id); if (!c) throw new NotFound("Non trovato nel catalogo"); return JSON.parse(JSON.stringify(c)); }
  if (kind === "cards") {
    if (params?.localId) { const n = params.localId.replace("eq:", ""); return pool.filter(c => c.localId === n).map(brief); }
    if (params?.name) { const q = params.name.toLowerCase(); return pool.filter(c => c.name.toLowerCase().includes(q)).map(brief); }
    return pool.map(brief);
  }
  if (kind === "sets" && id) { const s = DEMO.sets[id]; if (!s) throw new NotFound("Non trovato nel catalogo"); return { ...s, cards: DEMO.cards.filter(c => c.set.id === id).map(brief) }; }
  if (kind === "sets") return Object.values(DEMO.sets).filter(s => (s.id === "SV2a") === isJp);
  if (kind === "series" && id) return { id, name: id, sets: Object.values(DEMO.sets).filter(s => s.serie.id === id) };
  if (kind === "series") return isJp ? [DEMO.serieJp] : DEMO.series;
  throw new NotFound("Non trovato nel catalogo");
}
async function seedDemo() {
  const add = async (id, lang, variant, cond, extra) => {
    const card = await loadCard(id, lang);
    await ensureSet(card.setId, card.lang);
    state.copies.push({ id: uid(), added: Date.now() + state.copies.length, cardKey: card.key, lang, variant, cond, graded: false, example: true, ...extra });
  };
  await add("sv03.5-006", "it", "holo", "NM");
  await add("sv03.5-006", "it", "holo", "EX");
  await add("sv03.5-199", "en", "holo", "NM", { graded: true, grader: "PSA", grade: "10", personal: 240 });
  await add("sv03.5-025", "it", "reverse", "NM");
  await add("sv03.5-025", "it", "reverse", "NM");
  await add("sv03.5-001", "it", "normal", "NM");
  await add("sv03.5-004", "it", "normal", "LP");
  await add("sv03.5-151", "it", "holo", "NM", { location: "Raccoglitore 1, pagina 17" });
  await add("sv02-193", "it", "holo", "NM");
  await add("swsh3-136", "it", "normal", "NM");
  await add("swsh3-136", "it", "reverse", "EX");
  await add("sv03.5-150", "en", "reverse", "NM");
  await add("SV2a-201", "ja", "holo", "NM", { purchase: 55 });
  await add("SV2a-006", "ja", "holo", "NM");
  const base = total(state.copies);
  const days = [28, 24, 20, 16, 12, 8, 4, 0];
  state.snapshots = days.map((d, i) => ({ day: new Date(Date.now() - d * 864e5).toISOString().slice(0, 10), value: +(base * [0.84, 0.88, 0.86, 0.9, 0.93, 0.92, 0.97, 1][i]).toFixed(2), copies: state.copies.length }));
}

// ================================================================ Avvio
(async function start() {
  render();
  const saved = await Store.load();
  if (saved) {
    // Anche l'archivio del telefono passa dal controllo. Se qualcosa non torna, l'originale resta da parte e non va perso.
    try {
      const { state: clean, dropped } = sanitizeState(saved);
      if (dropped) Store.keep("state-prima-del-controllo", saved);
      state = clean;
    } catch {
      Store.keep("state-prima-del-controllo", saved);
      state = { ...state, ...saved, settings: { ...state.settings, ...(saved.settings || {}) } };
    }
  }
  if (isPreview) {
    await checkOnline();
    if (!online && !state.copies.length) await seedDemo();
  }
  try { if (navigator.storage?.persist) navigator.storage.persist(); } catch {}
  if ("serviceWorker" in navigator && location.protocol === "https:" && !isPreview) navigator.serviceWorker.register("sw.js").catch(() => {});
  if (isPreview) $("#help-btn").href = GUIDE_URL;
  render();
  if (!state.settings.onboarded) openWelcome();
  setIndex(state.settings.scanLang || state.settings.lang);
  if (online && state.copies.length && Date.now() - (state.lastRefresh || 0) > 20 * 3600e3) { await refreshPrices(); render(); }
  else if (state.copies.length) recordSnapshot();
})();
