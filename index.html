<body>
<title>Raccoglitore TCG</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: schede con barra in basso e pulsante Scansiona al centro; edizione → serie → espansione; ogni espansione è un raccoglitore a tasche 3×3 */
:root {
  --bg: #f2f3fa;
  --surface: #ffffff;
  --sunk: #e8eaf5;
  --ink: #161a33;
  --muted: #5c6286;
  --line: #dcdff0;
  --accent: #3b4cca;
  --accent-ink: #ffffff;
  --accent-soft: #e3e6fb;
  --gold: #f5b800;
  --gold-ink: #2a1f00;
  --frame: #f7c724;
  --good: #1f9d5c;
  --warn: #c66a00;
  --bad: #d23f45;
  --e-it: #1f9d5c; --e-en: #2f7de1; --e-ja: #e0454b; --e-ko: #8a52d6; --e-zh: #c99300; --e-other: #6b7196;
  --back-1: #263a9c; --back-2: #1a2670;
  --shadow: 0 1px 2px rgba(22, 26, 51, .06), 0 6px 18px rgba(22, 26, 51, .07);
  --holo: linear-gradient(115deg, #7fd3ff 0%, #b49bff 22%, #ff9ad5 42%, #ffe48a 62%, #8ff0c4 80%, #7fd3ff 100%);
  --font-display: "Baloo 2", "Avenir Next Rounded", "Arial Rounded MT Bold", system-ui, sans-serif;
  --font-body: "Nunito", -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --radius: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c0f22; --surface: #161a36; --sunk: #10132a; --ink: #eef0ff; --muted: #9ba1c9; --line: #272c53;
    --accent: #8d98ff; --accent-ink: #0c0f22; --accent-soft: #232a5c; --gold: #ffd23f; --gold-ink: #2a1f00; --frame: #e7b912;
    --good: #45d18a; --warn: #f2a23c; --bad: #ff7a7f;
    --e-it: #45d18a; --e-en: #5aa0ff; --e-ja: #ff6b70; --e-ko: #b48cff; --e-zh: #f2c230; --e-other: #9ba1c9;
    --back-1: #2a3fae; --back-2: #141c56;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c0f22; --surface: #161a36; --sunk: #10132a; --ink: #eef0ff; --muted: #9ba1c9; --line: #272c53;
  --accent: #8d98ff; --accent-ink: #0c0f22; --accent-soft: #232a5c; --gold: #ffd23f; --gold-ink: #2a1f00; --frame: #e7b912;
  --good: #45d18a; --warn: #f2a23c; --bad: #ff7a7f;
  --e-it: #45d18a; --e-en: #5aa0ff; --e-ja: #ff6b70; --e-ko: #b48cff; --e-zh: #f2c230; --e-other: #9ba1c9;
  --back-1: #2a3fae; --back-2: #141c56;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .35);
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { -webkit-user-select: none; user-select: none; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 8px; }

.app { display: flex; flex-direction: column; min-height: 100%; }
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px 8px; display: flex; align-items: center; gap: 8px;
}
.top h1 { font-family: var(--font-display); font-weight: 800; font-size: 28px; line-height: 1.1; margin: 0; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.top h1.small { font-size: 21px; line-height: 1.15; white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
.icon-btn { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--surface); box-shadow: var(--shadow); display: grid; place-items: center; cursor: pointer; flex: none; }
.icon-btn svg { width: 22px; height: 22px; }
a.icon-btn { color: inherit; text-decoration: none; }
.top .actions { display: flex; gap: 8px; flex: none; }
.notice { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow), inset 4px 0 0 var(--gold); }
.notice .grow b { display: block; }
.steps { display: grid; gap: 12px; margin: 0; padding: 0; list-style: none; counter-reset: step; }
.steps li { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 12px; align-items: start; counter-increment: step; }
.steps li::before { content: counter(step); width: 36px; height: 36px; border-radius: 50%; background: var(--gold); color: var(--gold-ink); font-family: var(--font-display); font-weight: 800; font-size: 18px; display: grid; place-items: center; }
.steps b { display: block; }
.welcome-hero { border-radius: 18px; padding: 18px; color: #fff; background: radial-gradient(120% 90% at 100% 0%, #5468ff 0%, #2a3aa8 45%, #19226b 100%); position: relative; overflow: hidden; }
.welcome-hero::after { content: ""; position: absolute; inset: 0; background: var(--holo); mix-blend-mode: soft-light; opacity: .55; pointer-events: none; }
.welcome-hero > * { position: relative; z-index: 1; }
.welcome-hero h3 { font-family: var(--font-display); font-size: 26px; line-height: 1.1; margin: 0 0 6px; }
.quickadd { display: grid; gap: 10px; padding: 14px; }
.quickadd .btn-row .btn { flex: 1 1 30%; }
.meta-line { font-size: 12px; color: var(--muted); text-align: center; }
main {
  flex: 1; box-sizing: border-box; width: 100%; max-width: 760px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 4px calc(104px + env(safe-area-inset-bottom, 0px)); display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; align-content: start;
}
[hidden] { display: none !important; }
/* Blocchi interni con titoli: stessa spaziatura della pagina (i titoli hanno il margine sotto negativo). */
#sets-area, #scan-panels, #mine-results { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; min-width: 0; }
#mine-results:empty { display: none; }
.filters { display: grid; gap: 10px; min-width: 0; }

/* Barra delle schede */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: grid; grid-template-columns: repeat(5, 1fr); align-items: end;
  background: var(--surface); box-shadow: 0 -1px 0 var(--line), 0 -8px 24px rgba(0,0,0,.06);
  padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
}
.tabs button { border: 0; background: none; padding: 9px 2px 8px; display: grid; justify-items: center; gap: 3px; font-size: 11px; font-weight: 700; color: var(--muted); cursor: pointer; min-height: 56px; }
.tabs button svg { width: 24px; height: 24px; }
.tabs button[aria-current="page"] { color: var(--accent); }
.tabs .scan-tab .fab {
  width: 60px; height: 60px; margin-top: -26px; border-radius: 50%; display: grid; place-items: center;
  background: var(--gold); color: var(--gold-ink); box-shadow: 0 0 0 5px var(--surface), 0 6px 16px rgba(245, 184, 0, .45);
}
.tabs .scan-tab .fab svg { width: 30px; height: 30px; }
.tabs .scan-tab[aria-current="page"] { color: var(--ink); }

/* Elementi comuni */
.banner { background: var(--accent-soft); border-radius: 12px; padding: 10px 12px; font-size: 13px; }
.panel { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
.section-title { font-family: var(--font-display); font-weight: 800; font-size: 21px; margin: 4px 2px -6px; display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px; }
.section-title small { font-family: var(--font-body); font-weight: 600; font-size: 13px; color: var(--muted); }
.row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; min-width: 0; min-height: 44px; box-sizing: border-box; }
.row + .row { border-top: 1px solid var(--line); }
button.row, a.row { width: 100%; border: 0; background: none; text-align: left; cursor: pointer; color: inherit; text-decoration: none; }
.grow { flex: 1; min-width: 0; }
.name { font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sub { color: var(--muted); font-size: 13px; }
.num { font-family: var(--font-mono); font-size: 13px; font-variant-numeric: tabular-nums; font-weight: 500; }
.euro { font-variant-numeric: tabular-nums; font-weight: 800; white-space: nowrap; }
.chev { color: var(--muted); font-size: 20px; line-height: 1; }
.note { font-size: 13px; color: var(--muted); margin: 0; }
.note.warn { color: var(--warn); font-weight: 700; }
.empty { text-align: center; padding: 28px 18px; display: grid; gap: 10px; justify-items: center; }
.empty h2 { font-family: var(--font-display); margin: 0; font-size: 22px; }

.btn { border: 0; background: var(--surface); box-shadow: var(--shadow); border-radius: 999px; padding: 10px 18px; font-weight: 800; cursor: pointer; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-align: center; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.gold { background: var(--gold); color: var(--gold-ink); }
.btn.ghost { background: transparent; box-shadow: inset 0 0 0 1.5px var(--line); }
.btn.small { min-height: 34px; padding: 6px 12px; font-size: 13px; }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .5; cursor: default; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; }

.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.chip.dup { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.chip.grade { background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--good); }
.chip.example { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
.chip.ed { background: color-mix(in srgb, var(--rc) 16%, transparent); color: var(--rc); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; background: var(--rc, var(--muted)); }

/* Selettori a pillole */
.seg { display: flex; flex-wrap: wrap; gap: 6px; padding: 2px; margin: -2px; min-width: 0; }
.seg.scroll { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
.seg.scroll.more { -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 32px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 32px), transparent); }
.seg::-webkit-scrollbar { display: none; }
.seg button { flex: none; border: 0; border-radius: 999px; padding: 8px 14px; min-height: 38px; background: var(--surface); box-shadow: inset 0 0 0 1.5px var(--line); font-weight: 700; font-size: 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); box-shadow: none; }
.seg button .count { font-size: 12px; opacity: .7; }

/* Carta "trofeo" del riepilogo */
.trophy { position: relative; border-radius: 22px; padding: 7px; background: var(--frame); box-shadow: var(--shadow), 0 10px 30px color-mix(in srgb, var(--frame) 30%, transparent); }
.trophy-inner { position: relative; border-radius: 16px; padding: 16px 16px 14px; overflow: hidden; background: radial-gradient(120% 90% at 100% 0%, #5468ff 0%, #2a3aa8 45%, #19226b 100%); color: #fff; }
.trophy-inner::after { content: ""; position: absolute; inset: 0; background: var(--holo); mix-blend-mode: soft-light; opacity: .55; pointer-events: none; }
.trophy-inner > * { position: relative; z-index: 1; }
.trophy .eyebrow { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; opacity: .85; }
.trophy .big { font-family: var(--font-display); font-weight: 800; font-size: 44px; line-height: 1.05; font-variant-numeric: tabular-nums; }
.trophy .stats { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 14px; }
.trophy .stats b { font-variant-numeric: tabular-nums; font-size: 17px; }
.trophy .delta { display: inline-block; font-weight: 800; font-size: 13px; padding: 2px 8px; border-radius: 999px; background: rgba(255,255,255,.18); margin-top: 8px; }
.trophy .spark { margin-top: 8px; }

.quick { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.quick .btn { width: 100%; }

/* Espansioni */
.serie-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 4px 2px -6px; font-weight: 800; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .07em; }
.set-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 10px; }
.set-tile { display: flex; gap: 12px; align-items: center; padding: 12px 12px 12px 16px; border: 0; background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); text-align: left; cursor: pointer; width: 100%; min-width: 0; color: inherit; position: relative; overflow: hidden; }
.set-tile::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--rc, var(--accent)); }
.set-tile.complete::after { content: ""; position: absolute; inset: 0; background: var(--holo); opacity: .14; pointer-events: none; }
.ring { width: 54px; height: 54px; flex: none; position: relative; display: grid; place-items: center; }
.ring svg { position: absolute; inset: 0; transform: rotate(-90deg); }
.ring b { font-size: 13px; font-variant-numeric: tabular-nums; }

/* Raccoglitore */
.binder-head { padding: 14px; display: grid; gap: 10px; }
.bar { height: 10px; border-radius: 5px; background: var(--sunk); overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--rc, var(--accent)); border-radius: 5px; }
.bar.full > span { background: var(--holo); }
.binder { display: grid; gap: 14px; }
.page { background: linear-gradient(180deg, var(--surface), var(--sunk)); border-radius: 18px; padding: 12px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 9px; box-shadow: var(--shadow); }
.page-label { grid-column: 1 / -1; font-size: 11px; font-weight: 800; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; display: flex; justify-content: space-between; }
.pocket { position: relative; border: 0; padding: 0; background: none; cursor: pointer; display: grid; gap: 4px; min-width: 0; color: inherit; }
.art { aspect-ratio: 245 / 337; max-width: 100%; border-radius: 7px; overflow: hidden; position: relative; background: var(--sunk); }
.art img { position: relative; width: 100%; height: 100%; object-fit: cover; display: block; }
.pocket.owned .art { box-shadow: 0 0 0 2px var(--frame), 0 4px 10px rgba(0,0,0,.15); }
.pocket.missing .art { opacity: .55; }
.pocket.missing .art img { filter: grayscale(1) brightness(1.05); opacity: .45; }
.pocket .count { position: absolute; top: -6px; right: -6px; min-width: 22px; height: 22px; display: grid; place-items: center; background: var(--good); color: #fff; font-size: 12px; font-weight: 800; border-radius: 11px; padding: 0 5px; box-sizing: border-box; box-shadow: 0 0 0 2px var(--surface); z-index: 1; }
.pocket .label { font-size: 11px; color: var(--muted); text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pocket .label.name-l { color: var(--ink); font-weight: 700; }
/* Dorso della carta, quando l'immagine non c'è */
.back { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 8px; box-sizing: border-box; color: #fff;
  background: repeating-linear-gradient(45deg, rgba(255,255,255,.07) 0 6px, transparent 6px 12px), radial-gradient(circle at 50% 45%, var(--back-1), var(--back-2)); }
.back b { display: block; font-size: 12px; line-height: 1.2; overflow-wrap: break-word; hyphens: auto; -webkit-hyphens: auto; }
@media (max-width: 360px) { .back { padding: 6px 4px; } .back b { font-size: 10.5px; } }
.back span { font-family: var(--font-mono); font-size: 11px; opacity: .85; }
.foil .art::after { content: ""; position: absolute; inset: 0; background: var(--holo); mix-blend-mode: color-dodge; opacity: .22; pointer-events: none; }

.grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 12px; }

/* Moduli */
.form { display: grid; gap: 14px; padding: 16px; }
.field { display: grid; gap: 6px; min-width: 0; }
.field > label, .field > .label { font-size: 13px; font-weight: 700; color: var(--muted); }
.field input, .field select, .field textarea, .searchbar input {
  border: 0; box-shadow: inset 0 0 0 1.5px var(--line); background: var(--surface); border-radius: 12px; padding: 10px 12px; width: 100%; box-sizing: border-box; min-width: 0; min-height: 44px;
}
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.check { display: flex; gap: 10px; align-items: center; font-weight: 700; min-height: 44px; }
.check input { width: 22px; height: 22px; accent-color: var(--accent); }
.searchbar { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }

/* Scansione */
.scanner { box-sizing: border-box; position: relative; border-radius: 22px; overflow: hidden; background: #05060f; aspect-ratio: 3 / 4; max-height: 60vh; width: 100%; max-width: 100%; margin: 0 auto; box-shadow: var(--shadow); }
.scanner video { width: 100%; height: 100%; object-fit: cover; display: block; }
/* La cornice sta tra la scritta in alto e i pulsanti in basso, così i pulsanti non coprono mai la zona del numero. */
.scanner .frame { position: absolute; left: 50%; top: 58px; height: calc(100% - 136px); width: auto; max-width: 74%; aspect-ratio: 245 / 337; transform: translateX(-50%); border-radius: 14px; box-shadow: 0 0 0 999px rgba(5, 6, 15, .45); }
.scanner .frame::before { content: ""; position: absolute; inset: 0; border-radius: 14px; border: 3px solid var(--frame); }
.scanner .frame .numzone { position: absolute; left: 6px; right: 6px; bottom: 6px; height: 15%; border-radius: 8px; border: 2px dashed rgba(255,255,255,.75); }
.scanner.reading .frame::before { animation: pulse 1.2s ease-in-out infinite; }
.scanner.hit .frame::before { border-color: var(--good); }
@keyframes pulse { 50% { opacity: .45; } }
@media (prefers-reduced-motion: reduce) { .scanner.reading .frame::before { animation: none; } }
.scanner .status { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); background: rgba(5,6,15,.72); color: #fff; font-weight: 700; font-size: 13px; padding: 6px 12px; border-radius: 16px; width: max-content; max-width: calc(100% - 24px); text-align: center; line-height: 1.3; box-sizing: border-box; }
.scanner .controls { position: absolute; left: 12px; right: 12px; bottom: 12px; display: flex; justify-content: space-between; gap: 8px; }
.scanner .controls .btn { background: rgba(5,6,15,.72); color: #fff; box-shadow: none; }
.scanner .controls .btn.gold { background: var(--gold); color: var(--gold-ink); }
.scanner .demo-cam { position: absolute; inset: 0; background: radial-gradient(60% 50% at 50% 50%, #3a3f5c 0%, #15182b 70%), #15182b; }
.scanner .demo-cam::after { content: ""; position: absolute; left: 50%; top: 50%; width: 60%; aspect-ratio: 245 / 337; transform: translate(-50%, -50%) rotate(-2deg); border-radius: 10px; background: linear-gradient(160deg, #f7c724 0 6%, #e8edf7 6% 94%, #f7c724 94%); box-shadow: 0 10px 30px rgba(0,0,0,.5); opacity: .9; }
.scanner.off { display: grid; place-items: center; color: #cfd5f5; padding: 24px; text-align: center; aspect-ratio: 4 / 3; }
.scanner.off .inner { display: grid; gap: 12px; justify-items: center; }
.session-bar .field > .label { display: flex; justify-content: space-between; gap: 8px; }
.picker { padding: 14px; display: grid; gap: 10px; box-shadow: var(--shadow), inset 0 0 0 2px var(--gold); }
.picker .options { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }

<script>
"use strict";
// ================================================================ Dati fissi
// L'edizione è la lingua di stampa: IT, EN, JP, KR, CN… come nei negozi. Le edizioni occidentali condividono le espansioni.
const LANGS = [
  ["it","Italiano","IT","intl","it"],["en","Inglese","EN","intl","en"],["fr","Francese","FR","intl","other"],["de","Tedesco","DE","intl","other"],
  ["es","Spagnolo","ES","intl","other"],["pt","Portoghese","PT","intl","other"],["ja","Giapponese","JP","jp","ja"],["ko","Coreano","KR","kr","ko"],
  ["zh-cn","Cinese semplificato","CN","cn","zh"],["zh-tw","Cinese tradizionale","TW","cn","zh"],["th","Thailandese","TH","sea","other"],["id","Indonesiano","ID","sea","other"]
].map(([code,name,short,region,color]) => ({code,name,short,region,color}));
const LANG = Object.fromEntries(LANGS.map(l => [l.code, l]));
const EDITION_ORDER = ["it","en","ja","ko","zh-cn","zh-tw","fr","de","es","pt","th","id"];
const VARIANTS = { normal: "Normale", reverse: "Reverse", holo: "Holo", firstEdition: "1ª ed." };
const CONDITIONS = [["MT","Mint"],["NM","Near Mint"],["EX","Excellent"],["GD","Good"],["LP","Light Played"],["PL","Played"],["PO","Poor"]];
const GRADERS = ["PSA","BGS","CGC","SGC","Altro"];
const RARITY_IT = {
  "common": "Comune", "uncommon": "Non comune", "rare": "Rara", "rare holo": "Rara holo", "holo rare": "Rara holo",
  "double rare": "Doppia rara", "ultra rare": "Ultra rara", "illustration rare": "Rara illustrazione",
  "special illustration rare": "Rara illustrazione speciale", "hyper rare": "Iper rara", "shiny rare": "Rara cromatica",
  "shiny ultra rare": "Ultra rara cromatica", "ace spec rare": "Rara ACE SPEC", "secret rare": "Rara segreta", "promo": "Promo",
  "amazing rare": "Rara straordinaria", "radiant rare": "Rara radiosa", "rare holo v": "Rara holo V", "rare holo vmax": "Rara holo VMAX",
  "rare holo vstar": "Rara holo VSTAR", "rare ultra": "Ultra rara", "rare secret": "Rara segreta", "rare rainbow": "Rara arcobaleno",
  "mega hyper rare": "Mega iper rara", "black white rare": "Rara bianco e nero"
};
const APP_VERSION = "1.6.1";
const APP_DATE = "31 ottobre 2026";
const GUIDE_URL = "https://claude.ai/artifact/3jA4rPapgx1RR4ZWzeLEEr";
const API = "https://api.tcgdex.net/v2";
// Listino pubblico di Cardmarket, scaricato ogni notte da un'azione GitHub sul ramo "dati" del repository dell'app.
// Si ricava dall'indirizzo dell'app (utente.github.io/repository); altrove (anteprima) non c'è.
const CM_DATA = (() => { const m = location.hostname.match(/^([a-z0-9-]+)\.github\.io$/i), repo = location.pathname.split("/")[1]; return m && repo ? `https://raw.githubusercontent.com/${m[1]}/${repo}/dati/cm/` : null; })();
// Lettore del numero (Tesseract.js 5.1.1): i file sono nella cartella ocr/ dell'app, non su server di terzi.
const OCR_DIR = new URL("ocr/", location.href).href;

const fallbackLang = code => LANG[code]?.region === "intl" ? "en" : code;
const regionOf = code => LANG[code]?.region || "intl";
const edColor = code => `var(--e-${LANG[code]?.color || "other"})`;
const edStyle = code => `style="--rc:${edColor(code)}"`;
const edName = code => LANG[code]?.name || code;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const euro = v => v == null || isNaN(v) ? "—" : new Intl.NumberFormat("it-IT", { style: "currency", currency: "EUR" }).format(v);
const today = () => new Date().toISOString().slice(0, 10);
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const itDate = d => d ? new Date(d + "T12:00:00").toLocaleDateString("it-IT", { day: "numeric", month: "long", year: "numeric" }) : "";
const rarityIt = r => RARITY_IT[String(r || "").toLowerCase()] || r || "";
// Numero come stampato: 006/165 (zeri a sinistra quando il numero è solo cifre)
function cardNumber(localId, official) {
  const id = String(localId ?? "");
  if (!official) return id;
  const w = Math.max(3, String(official).length);
  // Numeri lunghi delle buste speciali (1807/07): il totale si scrive come stampato, a due cifre.
  if (/^\d{4,}$/.test(id)) return `${id}/${String(official).padStart(2, "0")}`;
  return `${/^\d+$/.test(id) ? id.padStart(w, "0") : id}/${String(official).padStart(w, "0")}`;
}

// ================================================================ Stato e salvataggio sul telefono (IndexedDB)
let state = { cards: {}, sets: {}, copies: [], snapshots: [], settings: { lang: "it", cond: "NM", coef: {} }, lastRefresh: 0 };
const Store = {
  db: null,
  open() {
    return new Promise(resolve => {
      try {
        const req = indexedDB.open("raccoglitore-tcg", 1);
        req.onupgradeneeded = () => req.result.createObjectStore("kv");
        req.onsuccess = () => { this.db = req.result; resolve(); };
        req.onerror = () => resolve();
      } catch { resolve(); }
    });
  },
  async load() {
    await this.open();
    if (!this.db) { try { const raw = localStorage.getItem("raccoglitore-tcg"); return raw ? JSON.parse(raw) : null; } catch { return null; } }
    return new Promise(resolve => {
      try {
        const r = this.db.transaction("kv").objectStore("kv").get("state");
        r.onsuccess = () => resolve(r.result || null);
        r.onerror = () => resolve(null);
      } catch { resolve(null); }
    });
  },
  keep(name, data) {
    try { if (this.db) this.db.transaction("kv", "readwrite").objectStore("kv").put(data, name); } catch {}
  },
  timer: null,
  save() {
    if (viewing) return;
    clearTimeout(this.timer);
    this.timer = setTimeout(() => {
      const data = JSON.parse(JSON.stringify(state));
      try {
        if (this.db) { this.db.transaction("kv", "readwrite").objectStore("kv").put(data, "state"); History.maybeSave(data); }
        else localStorage.setItem("raccoglitore-tcg", JSON.stringify(data));
      } catch (e) { console.warn("Salvataggio non riuscito", e); }
    }, 250);
  }
};

// ================================================================ Foto delle tue copie e storico automatico (nello stesso archivio del telefono)
const idbReq = (mode, fn) => new Promise(res => {
  try { const tx = Store.db.transaction("kv", mode), r = fn(tx.objectStore("kv")); tx.oncomplete = () => res(r?.result ?? true); tx.onerror = tx.onabort = () => res(null); }
  catch { res(null); }
});
const Photos = {
  urls: new Map(),
  prefix: "photo:",
  key(id) { return this.prefix + id; },
  reset() { for (const u of this.urls.values()) URL.revokeObjectURL(u); this.urls.clear(); },
  async put(id, blob) { if (!Store.db || !blob) return false; const ok = await idbReq("readwrite", s => s.put(blob, this.key(id))); this.drop(id); return !!ok; },
  get(id) { return Store.db ? idbReq("readonly", s => s.get(this.key(id))) : Promise.resolve(null); },
  drop(id) { const u = this.urls.get(id); if (u) { URL.revokeObjectURL(u); this.urls.delete(id); } },
  del(id) { this.drop(id); if (Store.db) idbReq("readwrite", s => s.delete(this.key(id))); },
  async url(id) {
    if (this.urls.has(id)) return this.urls.get(id);
    const b = await this.get(id); if (!(b instanceof Blob)) return null;
    const u = URL.createObjectURL(b); this.urls.set(id, u); return u;
  }
};
// Le foto si caricano dopo il disegno: ogni <img data-photo="id"> riceve la sua immagine.
async function hydratePhotos() {
  for (const img of document.querySelectorAll("img[data-photo]:not([src]):not([data-loading])")) {
    img.dataset.loading = "1";
    const u = await Photos.url(img.dataset.photo);
    if (u) img.src = u; else img.closest(".photo-slot")?.classList.add("empty"), img.remove();
  }
}
new MutationObserver(() => hydratePhotos()).observe(document.body, { childList: true, subtree: true });
const blobToDataURL = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(b); });
const dataURLToBlob = u => { const [head, b64] = u.split(","), bin = atob(b64), a = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return new Blob([a], { type: head.slice(5).split(";")[0] }); };
// Riduce una foto scelta o scattata a 900 pixel sul lato lungo.
async function shrinkPhoto(file, max = 900) {
  const bmp = await createImageBitmap(file), k = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas"); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise(res => c.toBlob(res, "image/jpeg", 0.82));
}
// Storico: una versione della collezione all'ora, le ultime 30, dentro il telefono. Protegge da errori e ripristini sbagliati.
const History = {
  last: 0,
  async maybeSave(data) {
    if (!Store.db || !data.copies?.length || Date.now() - this.last < 3600e3) return;
    this.last = Date.now();
    await idbReq("readwrite", s => s.put({ at: Date.now(), copies: data.copies.length, data }, "hist:" + Date.now()));
    const keys = (await this.keys()).sort();
    for (const k of keys.slice(0, Math.max(0, keys.length - 30))) idbReq("readwrite", s => s.delete(k));
  },
  async keys() { const k = await idbReq("readonly", s => s.getAllKeys()); return (k || []).filter(x => String(x).startsWith("hist:")); },
  async list() { const out = []; for (const k of (await this.keys()).sort().reverse()) { const v = await idbReq("readonly", s => s.get(k)); if (v) out.push({ key: k, at: v.at, copies: v.copies }); } return out; },
  get(k) { return idbReq("readonly", s => s.get(k)); }
};
// ================================================================ Collezioni di famiglia
// Un familiare condivide la sua collezione come file; tu la apri e la guardi accanto alla tua, senza toccarla.
const idbGet = k => Store.db ? idbReq("readonly", s => s.get(k)) : Promise.resolve(null);
const idbPut = (k, v) => Store.db ? idbReq("readwrite", s => s.put(v, k)) : Promise.resolve(null);
let viewing = null, myState = null;
const Family = {
  list: [],
  async load() { const l = await idbGet("family:index"); this.list = Array.isArray(l) ? l : []; },
  save() { return idbPut("family:index", this.list); },
  async import(raw, fileName) {
    const { state: clean } = sanitizeState(raw);
    const owner = txt(raw?.share?.owner, 40).trim() || txt(String(fileName || "").replace(/\.json$/i, "").replace(/^collezione-/i, "").replace(/-\d{4}-\d{2}-\d{2}$/, ""), 40) || "Familiare";
    let fam = this.list.find(f => f.name.toLowerCase() === owner.toLowerCase());
    if (!fam) { fam = { id: uid().slice(0, 8), name: owner }; this.list.push(fam); }
    else await this.dropPhotos(fam.id);
    const ids = new Set(clean.copies.map(c => c.id));
    let photos = 0;
    if (isObj(raw.photos)) for (const [id, u] of Object.entries(raw.photos)) {
      if (!ids.has(id) || typeof u !== "string" || u.length > 6e6 || !/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(u)) continue;
      try { if (await idbPut(`fphoto:${fam.id}:${id}`, dataURLToBlob(u))) photos++; } catch {}
    }
    for (const c of clean.copies) if (c.photo && !raw.photos?.[c.id]) delete c.photo;
    Object.assign(fam, { copies: clean.copies.length, value: Math.round(clean.copies.reduce((t, c) => t + (copyValueIn(clean, c) || 0), 0) * 100) / 100,
      sharedAt: numIn(Date.parse(raw?.share?.sharedAt), 0, 1e14) || Date.now(), importedAt: Date.now(), photos });
    await idbPut("family:" + fam.id, clean);
    await this.save();
    return fam;
  },
  async dropPhotos(id) {
    const keys = (await idbReq("readonly", s => s.getAllKeys())) || [];
    for (const k of keys) if (String(k).startsWith(`fphoto:${id}:`)) idbReq("readwrite", s => s.delete(k));
  },
  async remove(id) {
    await this.dropPhotos(id);
    idbReq("readwrite", s => s.delete("family:" + id));
    this.list = this.list.filter(f => f.id !== id);
    await this.save();
  }
};
// Valore di una copia in una collezione qualsiasi (stesse regole della tua).
function copyValueIn(st, cp) {
  if (cp.personal != null) return cp.personal;
  const card = st.cards[cp.cardKey]; if (!card) return null;
  const p = marketPrice(card, cp.variant);
  return p == null ? null : p * (st.settings.coef?.[cp.lang] ?? 1);
}
async function viewCollection(id) {
  stopScanner(); closeSheet();
  if (!id || id === "me") {
    if (viewing) { state = myState; viewing = null; myState = null; Photos.prefix = "photo:"; Photos.reset(); }
  } else {

  const hits = [];

function parseNumber(text) {

  const m = String(text).toUpperCase().replace(/[|\\]/g, "/").match(/(?<![0-9A-Z])([A-Z]{0,3}[0-9]{1,4})\s*(?:[\/\-.,]|\s)\s*([0-9]{1,3})(?![0-9])/);

    const n = parseInt(m[1].replace(/\D/g, ""), 10), t = parseInt(m[2], 10);
    if (isNaN(n) || isNaN(t) || n === 0 || (n > t + 150 && !(t <= 30 && n <= 9999))) return null;
    return { number: m[1], total: t };
  }
  const plain = String(text).trim();
  return /^[A-Z0-9]{1,8}$/i.test(plain) ? { number: plain, total: null } : null;
}

  if (/^\d+$/.test(num)) for (const p of [num.padStart(3, "0"), num.padStart(2, "0")]) if (!forms.includes(p)) forms.push(p);

}

async function findByNumber(printed, lang) {

  const attempt = async l => {
    const idx = await setIndex(l);

    if (printed.total) sets = sets.filter(s => s.cardCount?.official === printed.total);
    else if (scan.lockSet || scan.session[0]) { const want = scan.lockSet?.id || cardOf(scan.session[0])?.setId; sets = sets.filter(s => s.id === want); }
    else sets = [];
    if (scan.lockSet) sets.sort((x, y) => (y.id === scan.lockSet.id) - (x.id === scan.lockSet.id));
    const items = [];
    for (const s of sets.slice(0, 10)) {
      let d; try { d = await setData(l)(s.id); } catch { continue; }
      for (const c of d.cards || []) if (sameLocal(c.localId, printed.number))
        items.push({ ...c, localId: String(c.localId), setId: s.id, setName: d.name || s.name, official: d.cardCount?.official || s.cardCount?.official || 0 });

function toast(text, undo) {
  const root = $("#toast-root");
  root.innerHTML = `<div class="toast" role="status"><span>${esc(text)}</span>${undo ? `<button id="toast-undo">Annulla</button>` : ""}</div>`;
  if (undo) $("#toast-undo").onclick = () => { undo(); root.innerHTML = ""; };
  clearTimeout(toast.t);
  toast.t = setTimeout(() => root.innerHTML = "", undo ? 4500 : 2600);
}
function art(card, high) {

// ================================================================ Collezione: edizione → serie → espansione
function summaries() {
  const groups = {};
  for (const cp of state.copies) {
    const card = cardOf(cp);
    if (card) (groups[`${cp.lang}|${card.setId}`] ||= []).push(cp);
  }
  return Object.entries(groups).map(([k, list]) => {
    const card = cardOf(list[0]);
    const ed = list[0].lang;
    const set = state.sets[`${card.lang}|${card.setId}`] || Object.values(state.sets).find(s => s.id === card.setId);
    const distinct = new Set(list.map(c => cardOf(c)?.id)).size;
    return { key: k, setId: card.setId, catLang: card.lang, ed, name: set?.name || card.setName, serieId: set?.serieId || "altro",
             serieName: set?.serieName || "Altro", release: set?.release || "", distinct, totalCards: set?.total || card.official || distinct,
             copies: list.length, value: total(list) };
  });
}
function valueDelta() {
  const s = state.snapshots;
  if (s.length < 2) return "";
  const now = s[s.length - 1].value;
  const ref = s.find(x => x.day >= new Date(Date.now() - 30 * 864e5).toISOString().slice(0, 10)) || s[0];
  if (!ref.value || ref === s[s.length - 1]) return "";
  const d = (now - ref.value) / ref.value;
  return `<span class="delta">${d >= 0 ? "▲" : "▼"} ${Math.abs(d * 100).toFixed(1).replace(".", ",")}% in 30 giorni</span>`;
}
function renderCollection(banner) {

  if (ui.browse) return renderBrowse(banner);
  setHeader(viewing ? `Collezione di ${viewing.name}` : "La mia collezione", false);
  const all = summaries();

  const eds = EDITION_ORDER.filter(e => all.some(s => s.ed === e));
  if (ui.edFilter !== "all" && !eds.includes(ui.edFilter)) ui.edFilter = "all";

    <section class="trophy" aria-label="Riepilogo della collezione"><div class="trophy-inner">

    </div></section>
    ${Family.list.length ? `<div class="coll-switch">${seg("coll-switch", [["me", "La mia"], ...Family.list.map(f => [f.id, esc(f.name)])], viewing?.id || "me", true)}</div>` : ""}
    ${viewing ? `<div class="quick"><button class="btn" data-action="browse">Tutte le espansioni</button><button class="btn ghost" data-action="family-exit">Torna alla tua</button></div>`
      : `<div class="quick"><button class="btn gold" data-tab="scan">Scansiona carte</button><button class="btn" data-action="browse">Tutte le espansioni</button><button class="btn ghost" data-action="share-mine">Condividi</button></div>`}
    ${viewing ? "" : notices()}`;
  if (!state.copies.length) {
    html += `<section class="panel empty"><h2>Il raccoglitore è vuoto</h2><p class="note">Inizia dalla scansione: inquadri le carte una dopo l'altra e l'app le archivia per edizione, serie ed espansione.</p></section>`;
    main.innerHTML = html; return;

  html += `<form class="searchbar" id="mine-form" role="search"><input id="mine-q" type="search" placeholder="Cerca una carta" value="${esc(ui.mineQ)}" aria-label="Cerca nella collezione" autocomplete="off" enterkeyhint="search"><button class="btn" type="submit">Cerca</button></form><div id="mine-results"></div><div id="sets-area">`;
  html += `<div class="filters">${eds.length > 1 ? seg("ed-filter", [["all", "Tutte", null], ...eds.map(e => [e, `<span class="dot" ${edStyle(e)}></span>${LANG[e].short}`, all.filter(s => s.ed === e).length])], ui.edFilter) : ""}${seg("sort-sets", [["recent", "Più recenti"], ["value", "Valore"], ["completion", "Completamento"]], ui.sort)}</div>`;
  const tile = (s, ed) => {
    const pct = s.totalCards ? Math.min(1, s.distinct / s.totalCards) : 0;
    return `<button class="set-tile ${pct >= 1 ? "complete" : ""}" ${edStyle(ed)} data-action="open-set" data-set="${esc(s.setId)}" data-lang="${esc(s.catLang)}" data-ed="${esc(ed)}">
      ${ring(pct, edColor(ed))}
      <div class="grow"><div class="name">${esc(s.name)}</div><div class="sub"><span class="num">${esc(s.distinct)}/${esc(s.totalCards)}</span> carte${s.release ? " · " + itDate(s.release) : ""}</div></div>
      <span class="euro">${euro(s.value)}</span></button>`;
  };
  for (const ed of eds) {

    const inEd = all.filter(s => s.ed === ed);
    const series = {};
    inEd.forEach(s => (series[s.serieId] ||= []).push(s));
    const ordered = Object.values(series).map(l => l.sort((a, b) => b.release.localeCompare(a.release))).sort((a, b) => b[0].release.localeCompare(a[0].release));
    html += `<h2 class="section-title"><span class="dot" style="--rc:${edColor(ed)};width:12px;height:12px"></span>Pokémon ${LANG[ed].short} <small>${inEd.length} espansioni · ${euro(inEd.reduce((s, x) => s + x.value, 0))}</small></h2>`;
    if (ui.sort !== "recent") {
      const key = ui.sort === "value" ? (s => s.value) : (s => s.totalCards ? s.distinct / s.totalCards : 0);
      html += `<div class="set-grid">${inEd.slice().sort((a, b) => key(b) - key(a)).map(s => tile(s, ed)).join("")}</div>`;
      continue;
    }
    for (const list of ordered) {
      html += `<div class="serie-head"><span>Serie ${esc(list[0].serieName)}</span></div><div class="set-grid">${list.map(s => tile(s, ed)).join("")}</div>`;
    }
  }
  html += `</div>`;
  main.innerHTML = html;
  const input = $("#mine-q");
  input.oninput = () => { ui.mineQ = input.value; showMine(); };
  $("#mine-form").onsubmit = e => { e.preventDefault(); input.blur(); };
  showMine();
}
// Ricerca istantanea tra le carte possedute (nome, numero o espansione).
function showMine() {
  const q = ui.mineQ.trim().toLowerCase();
  const box = $("#mine-results"), sets = $("#sets-area");
  if (!box || !sets) return;
  sets.hidden = !!q;
  if (!q) { box.innerHTML = ""; return; }
  const groups = new Map();
  for (const c of state.copies) {
    const card = cardOf(c);
    if (!card) continue;
    const hay = `${card.name} ${card.setName} ${cardNumber(card.localId, card.official)} ${card.localId}`.toLowerCase();
    if (!hay.includes(q)) continue;
    const k = `${card.id}|${c.lang}`;
    if (!groups.has(k)) groups.set(k, { card, ed: c.lang, n: 0, v: 0 });
    const g = groups.get(k); g.n++; g.v += copyValue(c);
  }
  const list = [...groups.values()].sort((a, b) => b.v - a.v);
  box.innerHTML = list.length ? `<p class="note">${list.length} carte trovate</p><div class="grid-cards" style="margin-top:8px">${list.map(g => `<button class="pocket owned ${isFoil(g.card) ? "foil" : ""}" data-action="open-card" data-id="${esc(g.card.id)}" data-lang="${esc(g.card.lang)}" data-ed="${esc(g.ed)}">${art(g.card)}<span class="count">${g.n}</span><span class="label name-l">${esc(g.card.name)}</span><span class="label">${esc(LANG[g.ed].short)} · ${esc(g.card.setName)}</span><span class="label euro" style="color:var(--ink)">${euro(g.v)}</span></button>`).join("")}</div>`
    : `<section class="panel empty"><h2>Nessuna carta trovata</h2><p class="note">Non hai carte che corrispondono a “${esc(ui.mineQ)}”. Per cercare nel catalogo usa la scheda Cerca.</p></section>`;
}

const setCache = {};
async function fetchSet(setId, lang) {
  const k = `${lang}|${setId}`;
  if (setCache[k]) return setCache[k];
  let used = lang, d;
  try { d = await api(lang, `sets/${encodeURIComponent(setId)}`); }
  catch (e) { if (fallbackLang(lang) === lang) throw e; used = fallbackLang(lang); d = await api(used, `sets/${encodeURIComponent(setId)}`); }
  storeSet(d, used);
  return (setCache[k] = { lang: used, data: d });
}
async function renderBinder(banner) {
  const view = ui.setView;
  setHeader("Espansione", true);
  main.innerHTML = banner + `<p class="note">Apro il raccoglitore…</p>`;
  let res;
  const customs = Object.values(state.cards).filter(k => k.custom && k.setId === view.setId && regionOf(k.lang) === regionOf(view.lang));
  try { res = await fetchSet(view.setId, view.lang); }
  catch (e) {
    if (!customs.length) { main.innerHTML = banner + `<section class="panel empty"><h2>Espansione non disponibile</h2><p class="note">${esc(e.message)}</p></section>`; return; }
    res = { lang: view.lang, data: { id: view.setId, name: customs[0].setName, cards: [], cardCount: { official: customs[0].official } } };
  }
  if (ui.setView !== view || ui.tab !== "collection") return;
  const d = res.data, ed = view.ed;
  setHeader(d.name, true);
  const owned = {}, myPhoto = {};
  state.copies.filter(c => c.lang === ed).forEach(c => { const id = cardOf(c)?.id; if (id) { owned[id] = (owned[id] || 0) + 1; if (c.photo && !myPhoto[id]) myPhoto[id] = c.id; } });
  const mine = view.img === "mine";
  const official = d.cardCount?.official || 0;
  const cards = (d.cards || []).map(c => ({ ...c, localId: String(c.localId) }));
  // Le carte che il catalogo non ha, ma tu sì.
  for (const k of customs) if (!cards.some(c => c.id === k.id)) cards.push({ id: k.id, localId: k.localId, name: k.name, image: "", custom: true, lang: k.lang });
  cards.sort((a, b) => (parseInt(a.localId, 10) || 0) - (parseInt(b.localId, 10) || 0));
  const have = cards.filter(c => owned[c.id]).length;
  const visible = view.filter === "missing" ? cards.filter(c => !owned[c.id]) : view.filter === "owned" ? cards.filter(c => owned[c.id]) : cards;
  const pct = cards.length ? have / cards.length : 0;
  const value = total(state.copies.filter(c => c.lang === ed && cardOf(c)?.setId === d.id));
  let pages = "";
  for (let i = 0; i < visible.length; i += 9) {
    const slice = visible.slice(i, i + 9);
    pages += `<div class="page"><div class="page-label"><span>Pagina ${i / 9 + 1}</span><span class="num">${esc(cardNumber(slice[0].localId, official).split("/")[0])}–${esc(cardNumber(slice[slice.length - 1].localId, official).split("/")[0])}</span></div>${slice.map(c => `
      <button class="pocket ${owned[c.id] ? "owned" : "missing"}" data-action="open-card" data-id="${esc(c.id)}" data-lang="${esc(c.lang || res.lang)}" data-ed="${esc(ed)}" aria-label="${esc(c.name)} ${esc(cardNumber(c.localId, official))}, ${owned[c.id] ? owned[c.id] + " possedute" : "mancante"}">
        ${(mine || c.custom) && myPhoto[c.id] ? `<div class="art"><img class="photo" data-photo="${esc(myPhoto[c.id])}" alt="La tua foto"></div>` : art(c)}${owned[c.id] ? `<span class="count">${owned[c.id]}</span>` : ""}
        <span class="label num">${esc(cardNumber(c.localId, official))}</span>
      </button>`).join("")}</div>`;
  }
  main.innerHTML = banner + `
    <section class="panel binder-head" ${edStyle(ed)}>
      <div class="chips" style="margin:0">${edChip(ed)}<span class="chip">Serie ${esc(d.serie?.name || "")}</span>${d.releaseDate ? `<span class="chip">${itDate(d.releaseDate)}</span>` : ""}</div>
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px"><div><b class="price-big" style="font-size:30px">${have}</b><span class="sub"> di ${cards.length} carte (${Math.round(pct * 100)}%)</span></div><span class="euro">${euro(value)}</span></div>
      <div class="bar ${pct >= 1 ? "full" : ""}"><span style="width:${(pct * 100).toFixed(1)}%"></span></div>
      ${seg("binder-filter", [["all", "Tutte", cards.length], ["owned", "Possedute", have], ["missing", "Mancanti", cards.length - have]], view.filter || "all")}
      ${Object.keys(myPhoto).length ? seg("binder-img", [["cat", "Immagini del catalogo"], ["mine", "Le mie foto", Object.keys(myPhoto).length]], view.img || "cat") : ""}
      <button class="btn gold" data-action="scan-this-set" data-set="${esc(d.id)}" data-name="${esc(d.name)}" data-ed="${esc(ed)}">Scansiona carte di questa espansione</button>
    </section>
    <div class="binder">${pages || `<p class="note">Nessuna carta in questo filtro.</p>`}</div>`;
}

// 1) Lettura continua del numero nella fascia bassa della carta, con tre trattamenti dell'immagine a rotazione.
// 2) Conferma quando lo stesso numero torna due volte in pochi istanti.
// 3) Analisi della carta intera: lingua (testo occidentale o scrittura asiatica), nome, foto.
// 4) Ricerca nel catalogo: carta unica e nome coerente → aggiunta automatica con la foto; altrimenti scelta con un tocco.

// ---------------------------------------------------------------- Lettori (Tesseract.js, ospitato nella cartella ocr/)
const tessOpts = () => ({ workerPath: OCR_DIR + "worker.min.js", corePath: OCR_DIR, langPath: OCR_DIR.replace(/\/$/, ""), workerBlobURL: false, gzip: true });
let tessLib = null;
function loadTessLib() {
  if (window.Tesseract) return Promise.resolve();
  return tessLib ||= new Promise((resolve, reject) => {
    const sc = document.createElement("script");
    sc.src = OCR_DIR + "tesseract.min.js"; sc.onload = resolve;
    sc.onerror = () => { tessLib = null; reject(new Error("Lettura automatica non disponibile")); };
    document.head.appendChild(sc);
  });
}
// eng: numeri e testo occidentale. jpn e kor: si scaricano solo la prima volta che serve una carta asiatica.
const workers = {}, workerLoading = {};
function loadWorker(lang = "eng") {
  if (workers[lang]) return Promise.resolve(workers[lang]);
  return workerLoading[lang] ||= (async () => {
    await loadTessLib();
    return (workers[lang] = await Tesseract.createWorker(lang, 1, tessOpts()));
  })().catch(e => { delete workerLoading[lang]; throw e; });

}

async function fillCustomSets(pend) {

// ================================================================ Valore
function sparkline(points) {
  if (points.length < 2) return "";
  const vals = points.map(p => p.value);
  const min = Math.min(...vals), max = Math.max(...vals), span = max - min || 1;
  const W = 300, H = 64, pad = 5;
  const xy = points.map((p, i) => [pad + i * (W - 2 * pad) / (points.length - 1), H - pad - (p.value - min) / span * (H - 2 * pad)]);
  const line = xy.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  const last = xy[xy.length - 1];
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="Andamento del valore"><path d="${line} L${last[0].toFixed(1)} ${H} L${pad} ${H} Z" fill="rgba(255,255,255,.18)"/><path d="${line}" fill="none" stroke="#ffffff" stroke-width="2.5" vector-effect="non-scaling-stroke"/><circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="4" fill="#ffd23f"/></svg>`;
}

  main.innerHTML = banner + `

function csv(list) {
  const ids = duplicateIds(state.copies);
  const num = v => v == null ? "" : v.toFixed(2).replace(".", ",");
  // Un testo che inizia con = + - @ verrebbe eseguito da Excel come formula: lo apro con un apostrofo (gli importi restano numeri).
  const q = v => {
    let s = String(v ?? "");
    if (/^[=+\-@\t\r]/.test(s) && !/^-?\d+(,\d+)?$/.test(s)) s = "'" + s;
    return /[;"\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  };
  const rows = [["Carta","Espansione","Numero","Rarità","ID TCGdex","Edizione","Variante","Condizione","Gradata","Voto","Doppione","Valore EUR","Prezzo acquisto EUR","Posizione","Note"]];
  for (const c of list) {
    const card = cardOf(c) || {};
    rows.push([card.name, card.setName, cardNumber(card.localId, card.official), rarityIt(card.rarity), card.id, LANG[c.lang]?.short, VARIANTS[c.variant],
      c.cond, c.graded ? "Sì" : "No", c.graded ? `${c.grader || ""} ${c.grade || ""}`.trim() : "", ids.has(c.id) ? "Sì" : "No",
      num(copyValue(c)), num(c.purchase), c.location, c.notes].map(q));
  }
  return "﻿" + rows.map(r => r.join(";")).join("\n");
}
async function shareFile(name, text, type) {
  const file = new File([text], name, { type });
  try { if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return true; } }
  catch (e) { if (e.name === "AbortError") return false; }
  if (isPreview) { toast("Nell'anteprima i file non si possono salvare"); return false; }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(file); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  return true;
}

function renderSearch(banner) {
  setHeader("Cerca", false);
  const s = ui.search;
  s.lang ||= state.settings.lang;
  main.innerHTML = banner + `
    <form class="searchbar" id="search-form"><input id="q" type="search" placeholder="Nome della carta, es. Pikachu" value="${esc(s.q)}" aria-label="Nome della carta" enterkeyhint="search"><button class="btn primary" type="submit">Cerca</button></form>
    ${seg("search-ed", ["it","en","ja","ko","zh-cn","zh-tw"].map(e => [e, `<span class="dot" ${edStyle(e)}></span>${LANG[e].short}`]), s.lang, true)}
    ${s.msg ? `<p class="note">${esc(s.msg)}</p>` : ""}
    <div class="grid-cards">${s.results.map(b => `<button class="pocket" data-action="open-card" data-id="${esc(b.id)}" data-lang="${esc(s.usedLang || s.lang)}" data-ed="${esc(s.usedLang || s.lang)}">${art(b)}<span class="label name-l">${esc(b.name)}</span><span class="label num">${esc(b.id)}</span></button>`).join("")}</div>`;
  $("#search-form").onsubmit = e => { e.preventDefault(); s.q = $("#q").value.trim(); doSearch(); };
}
async function doSearch() {
  const s = ui.search;
  if (s.q.length < 2) { s.msg = "Scrivi almeno due lettere."; render(); return; }
  s.msg = "Cerco…"; render();
  try {
    const list = await api(s.lang, "cards", { name: s.q });
    s.results = list.slice().reverse().slice(0, 240).map(b => ({ ...b, localId: String(b.localId) }));
    s.usedLang = s.lang;
    s.msg = s.results.length ? `${list.length} carte trovate${list.length > 240 ? ", le 240 più recenti" : ""}.` : `Nessuna carta trovata nell'edizione ${LANG[s.lang].short}.`;
  } catch (e) { s.results = []; s.msg = e.message; }
  render();
}

  sheet = { id, lang, ed: ed || lang, card: null, error: null, form: null };

  try { sheet.card = await loadCard(id, lang); } catch (e) { if (sheet) sheet.error = e.message; }
  drawSheet();
}
function closeSheet() {
  sheet = null; $("#sheet-root").innerHTML = "";

}

async function runCmSearch() {
  const m = sheet?.cm; if (!m) return;

  try { const r = await cmSearch(m.q, sheet.card?.setId); if (sheet?.cm !== m) return; m.results = r; m.msg = r.length ? `${r.length} prodotti trovati${r.length === 60 ? " (i più recenti)" : ""}.` : "Nessun prodotto con questo nome: prova con il nome inglese."; }
  catch (e) { m.msg = e.message; }
  drawSheet();
  $(".cm-panel")?.scrollIntoView({ block: "start" });
}
function quickEd(c) {
  const region = regionOf(c.lang);
  return regionOf(sheet.ed) === region ? sheet.ed : (regionOf(state.settings.lang) === region ? state.settings.lang : c.lang);
}

function readForm() {
  const f = sheet.form;
  if (!$("#copy-form")) return;
  const num = id => { const v = parseFloat(String($(id).value).replace(",", ".")); return isNaN(v) ? null : v; };
  f.graded = $("#f-graded").checked; f.grader = $("#f-grader").value; f.grade = $("#f-grade").value.trim();
  f.purchase = num("#f-purchase"); f.personal = num("#f-personal");
  f.location = $("#f-location").value.trim(); f.notes = $("#f-notes").value.trim();
}
function bindForm(c) {
  $("#f-graded").onchange = e => { $("#grade-fields").hidden = !e.target.checked; };
  $("#f-photo").onchange = async e => {
    const file = e.target.files?.[0]; if (!file) return;
    readForm();
    const blob = await shrinkPhoto(file).catch(() => null);
    if (!blob) { toast("Foto non leggibile"); return; }
    const f = sheet.form;
    if (f.id) { if (await Photos.put(f.id, blob)) { const cp = state.copies.find(x => x.id === f.id); if (cp) cp.photo = f.photo = true; Store.save(); toast("Foto salvata"); } }
    else { if (f.photoPreview) URL.revokeObjectURL(f.photoPreview); f.photoBlob = blob; f.photoPreview = URL.createObjectURL(blob); }
    drawSheet();
  };
  $("#copy-form").onsubmit = async e => {
    e.preventDefault();
    readForm();
    const f = sheet.form;
    $("#f-save").disabled = true;
    let target = c;
    if (f.lang !== c.lang) target = await loadCard(c.id, f.lang).catch(() => c);
    const data = { cardKey: target.key, lang: f.lang, variant: f.variant, cond: f.cond, graded: f.graded, grader: f.graded ? f.grader : null,
                   grade: f.graded ? f.grade : null, purchase: f.purchase, personal: f.personal, location: f.location, notes: f.notes };
    if (f.id) Object.assign(state.copies.find(cp => cp.id === f.id), data);
    else {
      const copy = { id: uid(), added: Date.now(), ...data };
      if (f.photoBlob && await Photos.put(copy.id, f.photoBlob)) copy.photo = true;
      state.copies.push(copy);
    }
    recordSnapshot();
    toast(f.id ? "Copia aggiornata" : `${target.name} aggiunta alla collezione`);
    sheet.form = null;
    drawSheet();
  };
}

// ================================================================ Eventi
document.addEventListener("click", async e => {
  const segBtn = e.target.closest("[data-seg]");
  if (segBtn) {
    const id = segBtn.dataset.seg, v = segBtn.dataset.value;
    if (id === "ed-filter") { ui.edFilter = v; render(); }
    else if (id === "sort-sets") { ui.sort = v; render(); }
    else if (id === "welcome-ed") { state.settings.lang = v; Store.save(); document.querySelectorAll('[data-seg="welcome-ed"]').forEach(b => b.setAttribute("aria-pressed", b === segBtn)); }
    else if (id === "binder-filter") { ui.setView.filter = v; render(); }
    else if (id === "binder-img") { ui.setView.img = v; render(); }
    else if (id === "coll-switch") viewCollection(v);
    else if (id === "browse-ed") { ui.browse.ed = v; render(); }
    else if (id === "search-ed") { ui.search.lang = v; if (ui.search.q) doSearch(); else render(); }
    else if (id === "scan-variant") { scan.variant = v; document.querySelectorAll('[data-seg="scan-variant"]').forEach(b => b.setAttribute("aria-pressed", b === segBtn)); }
    else if (id === "f-variant" || id === "f-cond" || id === "f-lang") { readForm(); sheet.form[{ "f-variant": "variant", "f-cond": "cond", "f-lang": "lang" }[id]] = v; drawSheet(); }
    return;
  }
  const el = e.target.closest("[data-action],[data-tab]");
  if (!el) return;
  const a = el.dataset.action;
  if (viewing && READ_ONLY_ACTIONS.has(a)) { toast(`Questa è la collezione di ${viewing.name}: qui puoi solo guardare`); return; }
  if (!a && el.dataset.tab) { ui.tab = el.dataset.tab; ui.setView = null; ui.browse = null; window.scrollTo(0, 0); render(); return; }
  switch (a) {
    case "browse": ui.browse = { ed: state.settings.lang && ["it","en","ja","ko","zh-cn","zh-tw"].includes(state.settings.lang) ? state.settings.lang : "it", serie: null }; render(); break;
    case "open-serie": ui.browse.serie = { id: el.dataset.id, name: el.dataset.name }; window.scrollTo(0, 0); render(); break;
    case "open-set": ui.setView = { setId: el.dataset.set, lang: el.dataset.lang, ed: el.dataset.ed || el.dataset.lang, filter: "all" }; ui.tab = "collection"; window.scrollTo(0, 0); render(); break;
    case "open-card": openCard(el.dataset.id, el.dataset.lang, el.dataset.ed); break;
    case "close-sheet": if (e.target === el) closeSheet(); break;
    case "close-sheet-btn": closeSheet(); break;
    case "new-copy": {
      const c = sheet.card, region = regionOf(c.lang);
      const pref = regionOf(sheet.ed) === region ? sheet.ed : (regionOf(state.settings.lang) === region ? state.settings.lang : c.lang);
      sheet.form = { lang: pref, variant: Object.keys(c.variants).find(k => c.variants[k]) || "normal", cond: state.settings.cond, graded: false, grader: "PSA" };
      drawSheet(); $("#copy-form")?.scrollIntoView({ behavior: "smooth", block: "start" }); break;
    }
    case "edit-copy": { const cp = state.copies.find(x => x.id === el.dataset.copy); sheet.form = { ...cp, grader: cp.grader || "PSA" }; drawSheet(); $("#copy-form")?.scrollIntoView({ block: "start" }); break; }
    case "delete-copy":
      if (!sheet.form.confirmDelete) { readForm(); sheet.form.confirmDelete = true; drawSheet(); break; }
      Photos.del(el.dataset.copy); state.copies = state.copies.filter(cp => cp.id !== el.dataset.copy); scan.session = scan.session.filter(cp => cp.id !== el.dataset.copy);
      recordSnapshot(); sheet.form = null; toast("Copia eliminata"); drawSheet(); break;
    case "shutter": if (scan.paused) { toast("Riprendi la lettura per scattare"); break; } scan.capture = true; setScanStatus("Scatto…", "hit"); break;
    case "toggle-pause": scan.paused = !scan.paused; el.textContent = scan.paused ? "Riprendi" : "Pausa"; setScanStatus(scan.paused ? "In pausa" : "Inquadra la carta: leggo il numero", ""); break;
    case "toggle-auto": scan.auto = !scan.auto; el.classList.toggle("gold", scan.auto); el.setAttribute("aria-pressed", scan.auto); el.textContent = `Auto: ${scan.auto ? "sì" : "no"}`; break;
    case "pick": { const b = scan.pending?.items.find(x => x.id === el.dataset.id); if (!b) break; const { lang: l, ctx } = scan.pending; scan.pending = null; await addFromScan(b, l, ctx); break; }
    case "skip-pending": if (scan.pending?.preview) URL.revokeObjectURL(scan.pending.preview); scan.pending = null; renderScanPanels(); setScanStatus("Inquadra la carta: leggo il numero", ""); break;
    case "cycle-variant": {
      const c = state.copies.find(x => x.id === el.dataset.copy), card = cardOf(c);
      const opts = Object.keys(card.variants).filter(k => card.variants[k]);
      c.variant = opts[(opts.indexOf(c.variant) + 1) % opts.length] || c.variant;
      const inf = scan.info.get(c.id); if (inf) inf.vguess = false;
      recordSnapshot(); renderScanPanels(); break;
    }
    case "remove-copy": removeCopy(el.dataset.copy); break;
    case "cm-link": { const c = sheet.card; sheet.cm = { q: latinWords(c.cmName ? c.cmName.replace(/\s*[[·].*$/, "") : c.name), results: null, msg: "" }; if (sheet.cm.q) runCmSearch(); else { drawSheet(); $(".cm-panel")?.scrollIntoView({ block: "start" }); } break; }
    case "cm-close": sheet.cm = null; drawSheet(); break;
    case "cm-pick": {
      const c = sheet.card, h = sheet.cm?.results?.find(x => String(x.id) === el.dataset.cm); if (!c || !h) break;
      c.cmId = h.id; c.cmName = `${h.name}${h.ver ? ` (versione ${h.ver} di ${h.vers})` : ""} · ${h.expName || "espansione " + h.exp}`;
      try { await applyCmPrice(c); } catch {}
      sheet.cm = null; recordSnapshot(); toast(`Collegata: ${euro(c.cm.trend ?? c.cm.trendHolo)}`); drawSheet(); break;
    }
    case "custom-add": {
      const pend = scan.pending; if (!pend?.custom) break;
      const name = $("#cu-name").value.trim(), lang = $("#cu-lang").value, setId = $("#cu-set").value, numTxt = $("#cu-num").value.trim();
      if (!name) { toast("Scrivi il nome della carta"); $("#cu-name").focus(); break; }
      const p = parseNumber(numTxt) || { number: numTxt.replace(/\s+/g, "") || "?", total: null };
      const set = setId !== "altro" ? (await setIndex(lang))[setId] : null;
      const card = makeCustomCard({ name, number: p.number, total: p.total || set?.cardCount?.official || 0, lang, setId: set ? setId : "altro", setName: set?.name || "Altre carte" });
      if (set) ensureSet(setId, lang).catch(() => {});
      if (pend.preview) URL.revokeObjectURL(pend.preview);
      scan.pending = null;
      if (regionOf(lang) === regionOf(pend.ctx?.lang || lang)) scan.lastLang = lang;
      await addFromScan({ id: card.id }, lang, { ...pend.ctx, lang, guess: false });
      break;
    }
    case "remove-photo": {
      readForm(); const f = sheet.form;
      if (f.id) { Photos.del(f.id); const cp = state.copies.find(x => x.id === f.id); if (cp) delete cp.photo; f.photo = false; Store.save(); }
      f.photoBlob = null; drawSheet(); break;
    }
    case "unlock-set": scan.lockSet = null; render(); break;
    case "scan-this-set": scan.lockSet = { id: el.dataset.set, name: el.dataset.name }; scan.lang = el.dataset.ed; findCache.clear(); ui.tab = "scan"; ui.setView = null; window.scrollTo(0, 0); render(); break;
    case "simulate": {
      const simLang = scan.lang === "auto" ? (scan.lastLang ||= state.settings.lang) : scan.lang;
      const pool = DEMO.cards.filter(c => (c.set.id === "SV2a") === (simLang === "ja") && (!scan.lockSet || c.set.id === scan.lockSet.id));
      const c = pool[Math.floor(Math.random() * pool.length)];
      if (!c) { toast("Nessuna carta di esempio per questa edizione"); break; }
      setScanStatus(`Letto ${cardNumber(c.localId, c.set.cardCount.official)}`, "hit");
      acceptNumber({ number: c.localId, total: c.set.cardCount.official }); break;
    }
    case "refresh": {
      if (!online) { toast("Nell'anteprima i prezzi non si aggiornano"); break; }
      el.disabled = true; el.textContent = "Aggiorno…";
      const r = await refreshPrices((d, t) => { el.textContent = `Aggiorno ${d} di ${t}…`; });
      toast(r.ko ? `${r.ok} prezzi aggiornati, ${r.ko} non riusciti` : `${r.ok} prezzi aggiornati`); render(); break;
    }
    case "backup": {
      el.disabled = true; const label = el.textContent; el.textContent = "Preparo la copia…";
      try {
        if (await shareFile(`raccoglitore-tcg-${today()}.json`, await backupJSON(), "application/json")) { state.lastBackup = Date.now(); Store.save(); toast("Copia di sicurezza salvata"); if (!sheet && ui.tab !== "scan") render(); }
      } finally { el.disabled = false; el.textContent = label; }
      break;
    }
    case "open-settings": openSettings(); break;
    case "family-exit": viewCollection(null); break;
    case "share-mine": {
      if (!state.settings.ownerName) { toast("Scrivi prima il tuo nome in Impostazioni › Collezioni di famiglia"); openSettings(); break; }
      el.disabled = true;
      try {
        const name = state.settings.ownerName.toLowerCase().normalize("NFKD").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "collezione";
        if (await shareFile(`collezione-${name}-${today()}.json`, await backupJSON(true), "application/json")) toast("Collezione condivisa: chi la riceve la apre da Impostazioni › Collezioni di famiglia");
      } finally { el.disabled = false; }
      break;
    }
    case "family-open": viewCollection(el.dataset.fam); break;
    case "family-remove": {
      if (el.dataset.confirm !== "1") { el.dataset.confirm = "1"; el.textContent = "Tocca di nuovo per togliere"; break; }
      await Family.remove(el.dataset.fam); toast("Collezione tolta"); closeSheet(); openSettings(); break;
    }
    case "restore-hist": {
      const v = await History.get(el.dataset.key);
      try {
        const { state: clean } = sanitizeState(v?.data);
        const before = state; state = clean; Store.save(); closeSheet();
        toast(`Ripristinata la versione con ${state.copies.length} copie`, () => { state = before; Store.save(); render(); toast("Ripristino annullato"); });
      } catch { toast("Questa versione non è leggibile"); }
      break;
    }
    case "show-welcome": openWelcome(); break;
    case "welcome-done": closeSheet(); break;
    case "dismiss-install": state.settings.installDismissed = true; Store.save(); render(); break;
    case "quick-add": {
      const c = sheet.card, ed = quickEd(c);
      let target = c;
      if (ed !== c.lang) target = await loadCard(c.id, ed).catch(() => c);
      const copy = { id: uid(), added: Date.now(), cardKey: target.key, lang: ed, variant: el.dataset.variant, cond: state.settings.cond, graded: false, grader: null, grade: null, purchase: null, personal: null, location: "", notes: "" };
      state.copies.push(copy);
      recordSnapshot();
      toast(`+1 ${target.name} ${VARIANTS[copy.variant]}`, () => { state.copies = state.copies.filter(x => x.id !== copy.id); recordSnapshot(); if (sheet?.card) drawSheet(); });
      drawSheet(); break;
    }
    case "csv-dups": { const ids = duplicateIds(state.copies); shareFile("doppioni.csv", csv(state.copies.filter(c => ids.has(c.id))), "text/csv"); break; }
    case "csv-all": shareFile("collezione.csv", csv(state.copies), "text/csv"); break;
  }
});
$("#settings-btn").onclick = async () => { if (viewing) await viewCollection(null); openSettings(); };
$("#back").onclick = () => {
  if (ui.setView) ui.setView = null;
  else if (ui.browse?.serie) ui.browse.serie = null;
  else ui.browse = null;
  render();
};
document.addEventListener("keydown", e => { if (e.key === "Escape" && sheet) closeSheet(); });
document.addEventListener("visibilitychange", () => { if (document.hidden) stopScanner(); else if (ui.tab === "scan" && !scan.cameraOff) startScanner(); });

// ================================================================ Dati di esempio (solo anteprima)
const DEMO = (() => {
  const serie = { id: "sv", name: "Scarlatto e Violetto" }, serieSwsh = { id: "swsh", name: "Spada e Scudo" }, serieJp = { id: "SV", name: "Scarlet & Violet" };
  const sets = {
    "sv03.5": { id: "sv03.5", name: "Pokémon 151", serie, releaseDate: "2023-09-22", cardCount: { official: 165, total: 207 } },
    "sv02": { id: "sv02", name: "Evoluzioni a Paldea", serie, releaseDate: "2023-06-09", cardCount: { official: 193, total: 279 } },
    "swsh3": { id: "swsh3", name: "Fiamme Oscure", serie: serieSwsh, releaseDate: "2020-08-14", cardCount: { official: 189, total: 201 } },
    "SV2a": { id: "SV2a", name: "Pokémon Card 151", serie: serieJp, releaseDate: "2023-06-16", cardCount: { official: 165, total: 210 } }
  };
  const mk = (set, localId, name, rarity, v, trend, trendHolo) => ({ id: `${set}-${localId}`, localId, name, rarity, set: sets[set], example: true,
    variants: { normal: v.includes("n"), reverse: v.includes("r"), holo: v.includes("h"), firstEdition: false },
    pricing: { cardmarket: { trend, avg30: +(trend * 0.96).toFixed(2), low: +(trend * 0.7).toFixed(2), "trend-holo": trendHolo ?? null, updated: today() } } });
  const cards = [
    mk("sv03.5","001","Bulbasaur","Common","nr",0.2,0.6), mk("sv03.5","004","Charmander","Common","nr",0.4,1.2),
    mk("sv03.5","006","Charizard-ex","Double rare","h",9.5), mk("sv03.5","025","Pikachu","Common","nr",0.5,1.5),
    mk("sv03.5","150","Mewtwo","Rare","nr",1.1,2.4), mk("sv03.5","151","Mew-ex","Double rare","h",5.8),
    mk("sv03.5","199","Charizard-ex","Special illustration rare","h",95), mk("sv03.5","205","Mew-ex","Hyper rare","h",28),
    mk("sv02","025","Pawmi","Common","nr",0.1,0.4), mk("sv02","193","Pikachu-ex","Double rare","h",3.2), mk("sv02","269","Magnemite","Illustration rare","h",4.4),
    mk("swsh3","136","Furret","Uncommon","nr",0.08,0.21), mk("swsh3","020","Charizard-VMAX","Ultra rare","h",22),
    mk("SV2a","006","Charizard ex","RR","h",8), mk("SV2a","201","Charizard ex","SAR","h",70)
  ];
  return { sets, cards, series: [serieSwsh, serie], serieJp };
})();
function demoApi(lang, path, params) {
  const brief = c => ({ id: c.id, localId: c.localId, name: c.name, image: "" });
  const isJp = lang === "ja";
  const pool = DEMO.cards.filter(c => (c.set.id === "SV2a") === isJp);
  const [kind, rawId] = path.split("/");
  const id = rawId ? decodeURIComponent(rawId) : null;
  if (kind === "cards" && id) { const c = DEMO.cards.find(x => x.id === id); if (!c) throw new NotFound("Non trovato nel catalogo"); return JSON.parse(JSON.stringify(c)); }
  if (kind === "cards") {
    if (params?.localId) { const n = params.localId.replace("eq:", ""); return pool.filter(c => c.localId === n).map(brief); }
    if (params?.name) { const q = params.name.toLowerCase(); return pool.filter(c => c.name.toLowerCase().includes(q)).map(brief); }
    return pool.map(brief);
  }
  if (kind === "sets" && id) { const s = DEMO.sets[id]; if (!s) throw new NotFound("Non trovato nel catalogo"); return { ...s, cards: DEMO.cards.filter(c => c.set.id === id).map(brief) }; }
  if (kind === "sets") return Object.values(DEMO.sets).filter(s => (s.id === "SV2a") === isJp);
  if (kind === "series" && id) return { id, name: id, sets: Object.values(DEMO.sets).filter(s => s.serie.id === id) };
  if (kind === "series") return isJp ? [DEMO.serieJp] : DEMO.series;
  throw new NotFound("Non trovato nel catalogo");
}
async function seedDemo() {
  const add = async (id, lang, variant, cond, extra) => {
    const card = await loadCard(id, lang);
    await ensureSet(card.setId, card.lang);
    state.copies.push({ id: uid(), added: Date.now() + state.copies.length, cardKey: card.key, lang, variant, cond, graded: false, example: true, ...extra });
  };
  await add("sv03.5-006", "it", "holo", "NM");
  await add("sv03.5-006", "it", "holo", "EX");
  await add("sv03.5-199", "en", "holo", "NM", { graded: true, grader: "PSA", grade: "10", personal: 240 });
  await add("sv03.5-025", "it", "reverse", "NM");
  await add("sv03.5-025", "it", "reverse", "NM");
  await add("sv03.5-001", "it", "normal", "NM");
  await add("sv03.5-004", "it", "normal", "LP");
  await add("sv03.5-151", "it", "holo", "NM", { location: "Raccoglitore 1, pagina 17" });
  await add("sv02-193", "it", "holo", "NM");
  await add("swsh3-136", "it", "normal", "NM");
  await add("swsh3-136", "it", "reverse", "EX");
  await add("sv03.5-150", "en", "reverse", "NM");
  await add("SV2a-201", "ja", "holo", "NM", { purchase: 55 });
  await add("SV2a-006", "ja", "holo", "NM");
  const base = total(state.copies);
  const days = [28, 24, 20, 16, 12, 8, 4, 0];
  state.snapshots = days.map((d, i) => ({ day: new Date(Date.now() - d * 864e5).toISOString().slice(0, 10), value: +(base * [0.84, 0.88, 0.86, 0.9, 0.93, 0.92, 0.97, 1][i]).toFixed(2), copies: state.copies.length }));
}

// ================================================================ Avvio
(async function start() {
  render();
  const saved = await Store.load();
  await Family.load();
  if (saved) {
    // Anche l'archivio del telefono passa dal controllo. Se qualcosa non torna, l'originale resta da parte e non va perso.
    try {
      const { state: clean, dropped } = sanitizeState(saved);
      if (dropped) Store.keep("state-prima-del-controllo", saved);
      state = clean;
    } catch {
      Store.keep("state-prima-del-controllo", saved);
      state = { ...state, ...saved, settings: { ...state.settings, ...(saved.settings || {}) } };
    }
  }
  if (isPreview) {
    await checkOnline();
    if (!online && !state.copies.length) await seedDemo();
  }
  try { if (navigator.storage?.persist) navigator.storage.persist(); } catch {}
  if ("serviceWorker" in navigator && location.protocol === "https:" && !isPreview) navigator.serviceWorker.register("sw.js").catch(() => {});
  if (isPreview) $("#help-btn").href = GUIDE_URL;
  render();
  if (!state.settings.onboarded) openWelcome();
  setIndex(state.settings.scanLang || state.settings.lang);
  if (online && state.copies.length && Date.now() - (state.lastRefresh || 0) > 20 * 3600e3) { await refreshPrices(); render(); }
  else if (state.copies.length) recordSnapshot();
})();
